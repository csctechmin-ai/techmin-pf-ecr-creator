<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VLEBook">
  <title>VLEBook</title>
  <defs>
    <linearGradient id="vb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4A7A"/>
      <stop offset="1" stop-color="#12345A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#vb-bg)"/>
  <!-- open ledger: left page -->
  <path d="M10 19.5 L30.5 23.5 V50 L10 46 Z" fill="#FFFFFF"/>
  <path d="M14.5 27.4 L26.5 29.6 M14.5 32.4 L26.5 34.6 M14.5 37.4 L23.5 39.1" stroke="#12345A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- right page -->
  <path d="M33.5 23.5 L54 19.5 V46 L33.5 50 Z" fill="#14A3B4"/>
  <!-- verified tick -->
  <path d="M38.2 35.6 L42.4 39.8 L49.6 30.6" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bookmark -->
  <path d="M44 14 h5 v9.5 l-2.5 -2 l-2.5 2 Z" fill="#F4B400"/>
</svg>
