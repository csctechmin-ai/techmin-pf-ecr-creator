<!DOCTYPE html>
<html lang="en" data-palette="zoho" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLEBook (Early Access) — Billing and Office Software for CSC, Akshaya and e-Seva Centres</title>
  <meta name="description" content="VLEBook (early access) is billing and office software for CSC, Akshaya, e-Seva and Jan Seva centres: customers, invoices, applications, AEPS records, accounts, stock and backups. Business data stays on the centre's computer. 14-day free trial.">
  <link rel="canonical" href="https://tools.complypro.co.in/vlebook/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="VLEBook (Early Access) — Billing and Office Software for CSC, Akshaya and e-Seva Centres">
  <meta property="og:description" content="Billing, customers, applications, AEPS records, accounts and stock for digital service centres. Business data stays on the centre's computer. 14-day free trial.">
  <meta property="og:url" content="https://tools.complypro.co.in/vlebook/">
  <meta property="og:site_name" content="ComplyPro Tools">
  <meta property="og:locale" content="en_IN">
  <meta name="theme-color" content="#0F172A">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://blogger.googleusercontent.com https://*.bp.blogspot.com https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self' data: blob: https://www.complypro.co.in https://script.google.com https://script.googleusercontent.com; font-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <script src="js/frameguard.js"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/vlebook-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <!-- Left Collapsible Sidebar -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-brand">
        <div class="brand-logo-wrap">
          <img class="brand-mark" src="icons/vlebook-mark.svg" alt="VLEBook" width="32" height="32">
          <div class="brand-titles">
            <span class="brand-name">VLEBook</span>
            <span class="brand-sub">CSC • Akshaya • E-Seva · Early access</span>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebar-collapse-btn" title="Collapse/Expand Sidebar" aria-label="Toggle Sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-list">
        <!-- Populated dynamically by js/app.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-details">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span>Local IndexedDB</span>
            <span id="sidebar-backup-status"></span>
          </div>
          <div class="storage-bar-track">
            <div class="storage-bar-fill" id="sidebar-storage-fill"></div>
          </div>
          <div id="sidebar-storage-text" style="color:var(--sidebar-text-muted); font-size:10.5px;">
            Initializing local database...
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="app-main">
      <!-- Top Persistent Navigation & Save Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
          <img class="centre-logo" id="header-centre-logo" alt="" hidden>
          <div class="centre-badge">
            <div class="centre-badge-title" id="header-centre-name">JanSeva & Akshaya Digital Kendra</div>
            <div class="centre-badge-meta" id="header-centre-meta">CSC • Track Every Rupee</div>
          </div>
        </div>

        <!-- Global Search -->
        <div class="header-search-wrap">
          <span class="header-search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input
            type="search"
            class="header-search-input"
            id="global-search-input"
            placeholder="Search Customer Mobile, Name, Invoice # or App Ref..."
            autocomplete="off"
          >
          <div class="global-search-results" id="global-search-results"></div>
        </div>

        <!-- Persistent Save Cluster & Quick Controls -->
        <div class="header-right">
          <div class="save-cluster" title="Automatic background saving is enabled for all forms, services, and records">
            <div>
              <div class="autosave-indicator">
                <span class="status-dot" id="autosave-dot"></span>
                <span id="autosave-status-text">Auto-Save: ON • Saved</span>
              </div>
              <span class="last-saved-time" id="autosave-last-time">Last saved: Just now</span>
            </div>
            <button type="button" class="persistent-save-btn" id="persistent-save-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span id="persistent-save-label">Save Now</span>
            </button>
          </div>

          <select class="form-control header-lang-select" id="header-lang-select" title="Language / भाषा / ഭാഷ" data-no-i18n>
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="ml">മലയാളം</option>
          </select>

          <button type="button" class="btn btn-sm backup-needed-pill" id="backup-needed-pill" hidden title="Data changed since your last backup — click to back up now">
            Backup needed
          </button>

          <button type="button" class="btn btn-sm btn-outline header-bell" id="header-bell-btn" title="Techmin Updates — notices and blog">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="bell-count" id="header-bell-count" hidden>0</span>
          </button>

          <span class="licence-pill" id="licence-pill" hidden></span>
          <div class="user-chip-wrap">
            <button type="button" class="user-chip" id="header-user-chip" title="My account">
              <span class="user-avatar" id="header-user-initials" data-no-i18n></span>
              <span class="user-text"><span id="header-user-name" data-no-i18n></span><small id="header-user-role"></small></span>
            </button>
            <div class="user-menu" id="header-user-menu" hidden>
              <button type="button" id="user-menu-password">Change my password</button>
              <button type="button" id="user-menu-account">Users & Licence</button>
              <button type="button" id="user-menu-logout">Sign out</button>
            </div>
          </div>

          <button type="button" class="btn btn-sm btn-outline" id="theme-toggle-btn" title="Switch Light / Dark Theme">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <!-- Active Module Workspace Container -->
      <main class="workspace-content" id="workspace-content" tabindex="-1">
        <!-- Rendered dynamically by js/app.js -->
      </main>
    </div>
  </div>

  <!-- Optional Session Lock PIN Modal -->
  <div class="modal-backdrop" id="pin-lock-modal">
    <div class="modal-dialog" style="max-width:380px;">
      <div class="modal-header">
        <h3>VLEBook Session Locked</h3>
      </div>
      <div class="modal-body">
        <p style="font-size:12.5px; color:var(--color-text-muted); margin-bottom:12px;">
          Enter your configured Centre Lock PIN to resume counter operations.
        </p>
        <form id="pin-unlock-form" class="form-grid" style="grid-template-columns:1fr;">
          <input type="password" class="form-control" id="pin-unlock-input" placeholder="Enter PIN" required autofocus>
          <div id="pin-unlock-error" style="color:var(--color-danger); font-size:12px;"></div>
          <button type="submit" class="btn btn-primary">Unlock Counter</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
