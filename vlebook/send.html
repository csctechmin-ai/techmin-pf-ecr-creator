<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Send files to the counter — VLE360</title>
  <link rel="icon" href="icons/favicon-32.png">
  <style>
    :root { --navy: #12345A; --teal: #0B7A8A; --line: #D5DEE8; --muted: #5B6B7B; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', 'Nirmala UI', Roboto, Arial, sans-serif; background: #F4F7FA; color: #0F172A; }
    header { background: var(--navy); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    header img { width: 34px; height: 34px; }
    header b { display: block; font-size: 17px; }
    header small { opacity: .85; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 6px; color: var(--navy); }
    p { margin: 6px 0; line-height: 1.45; }
    .muted { color: var(--muted); font-size: 13px; }
    .pick { display: block; text-align: center; padding: 22px 12px; border: 2px dashed var(--teal); border-radius: 12px; color: var(--teal); font-weight: 700; font-size: 17px; cursor: pointer; }
    .pick input { display: none; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
    button:disabled { background: #9DB3BD; }
    ul { list-style: none; padding: 0; margin: 10px 0; }
    li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #EEF2F6; font-size: 14px; }
    li span:first-child { overflow-wrap: anywhere; }
    .ok { color: #14804A; font-weight: 700; }
    .err { color: #B42318; font-weight: 600; }
    .lang { margin-left: auto; }
    .lang select { padding: 4px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/vle360-mark.svg" alt="">
    <div><b id="h-title">Send files to the counter</b><small id="h-centre"></small></div>
    <div class="lang"><select id="lang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="ml">മലയാളം</option></select></div>
  </header>
  <main>
    <div class="card" id="box">
      <p class="muted" id="msg">…</p>
    </div>
    <div class="card muted" id="privacy"></div>
  </main>
  <script type="module" src="js/send-page.js"></script>
</body>
</html>
