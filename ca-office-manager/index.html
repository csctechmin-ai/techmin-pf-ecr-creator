>You have already checked in today.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You have already checked out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You have not checked in today.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"release":[{"id":"version-1-0-0-29-october-2026","title":"Version 1.0.0 - 29 October 2026","html":"\u003cp>First release of CA Office Manager, a work, client, time, fee and compliance management system for chartered accountancy firms. It runs as a web page hosted on GitHub Pages and stores its data in the firm's own Google account (Google Sheets for data, Drive for documents, Gmail for email).\u003c/p>\u003cp>\u003cb>Status: under testing.\u003c/b> The application code passed 171 automated backend tests and 75 browser tests against a simulated Google environment. Behaviour that depends on Google itself (real Drive, Gmail sending, scheduled triggers) has not yet been verified on the live account. See \u003ci>Known limitations\u003c/i>.\u003c/p>"},{"id":"what-is-included","title":"What is included","html":"\u003cul>\u003cli>\u003cb>Clients\u003c/b>: master records with PAN, GSTIN, TAN checks, contacts, services by financial year, pipeline stages, CSV import with dry run and CSV export, masked identifiers.\u003c/li>\u003cli>\u003cb>Tasks\u003c/b>: templates, allocation with workload warnings, acknowledgement, instructions with version history, checklists with mandatory items, dependencies, senior and partner review with correction rounds, bulk create, bulk reassign and bulk due-date change, recurring tasks, full task history.\u003c/li>\u003cli>\u003cb>Time and leave\u003c/b>: running timer with pause and resume, manual entries, correction requests and approvals, attendance check-in and check-out, leave requests, approvals and balances, productivity and unallocated-time views.\u003c/li>\u003cli>\u003cb>Compliance calendar\u003c/b>: due dates entered and verified by the firm, per-client filings, acknowledgement numbers, tasks created from filings, reminders.\u003c/li>\u003cli>\u003cb>Fees and receipts\u003c/b>: fee agreements, draft and issued invoices with server-side tax, receipts and allocations, credit notes, write-offs, cancellations with reasons, follow-up register, ageing, outstanding and statements.\u003c/li>\u003cli>\u003cb>Physical files\u003c/b>: inward entry, transfers with acknowledgement, outside parties with expected return dates, return, archive, lost-file exceptions, overdue reminders.\u003c/li>\u003cli>\u003cb>Documents\u003c/b>: Drive folders per client, versioning, three confidentiality classes, document requests with checklists, every download logged, no public links.\u003c/li>\u003cli>\u003cb>Client email\u003c/b>: templates, drafts, approval by senior or partner, safe sending with duplicate protection, delivery log and quota check.\u003c/li>\u003cli>\u003cb>Reports\u003c/b>: 25 reports with CSV export and print.\u003c/li>\u003cli>\u003cb>Administration\u003c/b>: users, roles and permissions (grant or deny per person), settings, masters and templates, audit log, backups, CSV export, document inventory, configuration export, backup verification and scheduled jobs.\u003c/li>\u003cli>\u003cb>Alerts and announcements\u003c/b> on the dashboard and in the top bar.\u003c/li>\u003c/ul>"},{"id":"new-in-this-release","title":"New in this release","html":"\u003cul>\u003cli>\u003cb>Self-registration with emailed activation key.\u003c/b> Visitors can register on the sign-in page. An activation key is emailed from the firm's sender address (info@techmincsc.in once the Gmail alias is set up). The key is stored only as a hash, expires in 3 days and works once.\u003c/li>\u003cli>\u003cb>Administrator approval\u003c/b> (on by default) before a self-registered person can sign in, with an approval email and a \u003ci>Pending approval\u003c/i> badge and \u003cb>Approve\u003c/b> button under Users.\u003c/li>\u003cli>\u003cb>Abuse protection\u003c/b> for registration: hidden spam field, a limit of 3 requests per email and 40 in total per hour, and identical replies for known and unknown emails.\u003c/li>\u003cli>\u003cb>GitHub Pages hosting.\u003c/b> The page is a static file at \u003ccode>https://tools.complypro.co.in/ca-office-manager/\u003c/code>. It talks to a Google Apps Script web address over HTTPS as a JSON service. A content security policy limits the page to its own files and Google script addresses.\u003c/li>\u003cli>\u003cb>Help inside the application\u003c/b>: a detailed user guide for every screen, the error-code reference and these release notes, available from \u003cb>Help\u003c/b> in the left menu.\u003c/li>\u003cli>\u003cb>Error codes\u003c/b> are shown at the end of every error message, for example \u003ci>[AUTH]\u003c/i>, \u003ci>[FORBIDDEN]\u003c/i> or \u003ci>[VALIDATION]\u003c/i>, so users and administrators can describe a problem precisely.\u003c/li>\u003cli>New settings: \u003ccode>open_registration\u003c/code>, \u003ccode>registration_approval\u003c/code>, \u003ccode>registration_default_role\u003c/code>, \u003ccode>mail_from\u003c/code>, \u003ccode>mail_from_name\u003c/code>, \u003ccode>app_url\u003c/code>.\u003c/li>\u003c/ul>"},{"id":"security-and-privacy","title":"Security and privacy","html":"\u003cul>\u003cli>Passwords are salted and hashed; activation keys and sessions are never stored in readable form.\u003c/li>\u003cli>Five wrong passwords lock the account for 15 minutes; sessions end after about 6 hours.\u003c/li>\u003cli>Permissions are checked by the server on every action; the menu only hides what you may not use.\u003c/li>\u003cli>Sensitive client identifiers are masked unless the person holds the specific permission.\u003c/li>\u003cli>Documents stay private in Drive; each download is logged; Restricted documents open only for the client's partner, the uploader and top management.\u003c/li>\u003cli>Every change is written to an audit log that cannot be edited.\u003c/li>\u003cli>The page sets no cookies and loads no advertising or third-party scripts; it keeps only your session and screen filters in the browser tab's session storage.\u003c/li>\u003c/ul>"},{"id":"requirements","title":"Requirements","html":"\u003cul>\u003cli>A current browser (Chrome, Edge, Firefox or Safari) with JavaScript enabled.\u003c/li>\u003cli>A Google account that owns the Apps Script project, the database sheet and the Drive folders (a dedicated Google Workspace account is recommended).\u003c/li>\u003cli>For emails from info@techmincsc.in: that address added under Gmail → Settings → Accounts → \u003ci>Send mail as\u003c/i> on the owner account.\u003c/li>\u003c/ul>"},{"id":"known-limitations","title":"Known limitations","html":"\u003cul>\u003cli>Sign-in is the application's own email-and-password system, with no two-factor step.\u003c/li>\u003cli>One Google account owns all data; keep backups outside it.\u003c/li>\u003cli>Google Sheets is not a transactional database; very large firms should plan archiving (see Limitations and quotas).\u003c/li>\u003cli>Gmail limits apply: about 100 emails a day on a free account and 1,500 on Workspace.\u003c/li>\u003cli>Statutory due dates and rates are not built in; the administrator enters and verifies them. The application does not compute GST, TDS or income tax returns and does not file on any government portal.\u003c/li>\u003cli>Integrations with government portals, e-signature, WhatsApp, SMS and payment gateways are not connected.\u003c/li>\u003cli>No offline mode; screens refresh when you move between them and alerts update about every 2 minutes.\u003c/li>\u003cli>Drive files are not scanned for viruses; only type and size are checked.\u003c/li>\u003c/ul>"},{"id":"not-yet-verified-on-the-live-account","title":"Not yet verified on the live account","html":"\u003cp>Real Drive upload and download, real Gmail sending and quota, the scheduled daily and weekly jobs, concurrent writes from several users, backup restore, and layout on real phones. Procedures are in the test report.\u003c/p>"},{"id":"upgrading","title":"Upgrading","html":"\u003cp>Changes to the page go live as soon as the new file is published on GitHub Pages (refresh with Ctrl+F5). Changes to the Apps Script code go live only after \u003ci>Deploy → Manage deployments → Edit → New version\u003c/i>. The database is not changed by an upgrade; the setup routine adds any missing tabs and settings and keeps existing data.\u003c/p>"},{"id":"support","title":"Support","html":"\u003cp>Quote the \u003cb>error code\u003c/b>, the \u003cb>full message\u003c/b> and, for SERVER errors, the \u003cb>reference\u003c/b>. Administrators find the reference in the Apps Script \u003ci>Executions\u003c/i> log.\u003c/p>"}]};
/*HELP:END*/
ROUTES.help = async (v, a) => {
  const TABS = [['guide', 'User guide'], ['errors', 'Error codes'], ['release', 'Release notes']], tab = HELP[a[0]] ? a[0] : 'guide', q = (store.get('hq') || '').trim().toLowerCase();
  const all = HELP[tab] || [], hit = q ? all.filter(x => (x.title + ' ' + x.html.replace(/<[^>]+>/g, ' ')).toLowerCase().includes(q)) : all;
  const cur = q ? null : (all.find(x => x.id === a[1]) || all[0]);
  put(v, html`<div class="bar"><h1 style="margin:0">Help</h1><div class="sp"></div><button class="btn" onclick="window.print()">Print</button></div>
   <div class="tabs">${TABS.map(t => html`<a href="#/help/${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]}</a>`)}</div>
   <form class="bar no-print" data-sub="help-q"><input type="search" name="q" value="${store.get('hq') || ''}" placeholder="Search this section (for example: invoice, AUTH, timer)" style="min-width:260px;flex:1"><button class="btn">Search</button>${q ? html`<button type="button" class="btn" data-act="help-clear">Clear</button>` : ''}</form>
   <div class="help-grid"><div class="card help-nav no-print" style="padding:6px">${(q ? hit : all).map(x => html`<a href="#/help/${tab}/${x.id}" class="${cur && cur.id === x.id ? 'on' : ''}">${x.title}</a>`)}${q && !hit.length ? html`<p class="muted small" style="padding:6px">No section matches.</p>` : ''}</div>
   <div class="card help">${q ? (hit.length ? hit.map(x => html`<h2>${x.title}</h2>${raw(x.html)}`) : html`<p class="muted">Nothing found for "${q}".</p>`) : (cur ? html`<h2>${cur.title}</h2>${raw(cur.html)}` : '')}</div></div>`);
};
SUB['help-q'] = d => { store.set('hq', d.q || ''); route(); };
ACT['help-clear'] = () => { store.set('hq', ''); route(); };
ROUTES.reports = async (v, a) => {
  const cat = await api('reports.catalog', {}); const id = a[0] || '';
  const side = html`<div class="card" style="padding:6px">${cat.map(c => html`<a href="#/reports/${c.id}" style="display:block;padding:6px 8px;border-radius:6px" class="${id === c.id ? 'btn pri' : ''}">${c.title}</a>`)}</div>`;
  if (!id) return put(v, html`<h1>Reports</h1><p class="muted">Choose a report. Reports include only the clients and staff you are authorised to see. Use Export CSV for spreadsheets or Print for a paper copy.</p><div class="grid g2">${cat.map(c => html`<a class="card" href="#/reports/${c.id}"><b>${c.title}</b></a>`)}</div>`);
  const f = { from: store.get('rf') || addDays(today(), -30), to: store.get('rt') || today(), client_id: store.get('rc') || '' }; const filters = {}; if (f.from) filters.from = f.from; if (f.to) filters.to = f.to; if (f.client_id) filters.client_id = f.client_id;
  const cl = has('client.view') ? await clientList() : [];
  const r = await api('reports.run', { id, filters });
  put(v, html`<div class="bar"><a href="#/reports">&larr; Reports</a><div class="sp"></div><button class="btn" data-act="rp-csv" data-id="${id}">Export CSV</button><button class="btn" onclick="window.print()">Print</button></div>
   <form class="bar no-print" data-sub="rp-filter"><input type="hidden" name="id" value="${id}"><label style="margin:0">From</label><input type="date" name="from" value="${f.from}"><label style="margin:0">To</label><input type="date" name="to" value="${f.to}">${cl.length ? html`<select name="client_id">${opt(clientOpts(cl), f.client_id, 'All clients')}</select>` : ''}<button class="btn pri">Run</button></form>${reportTable(r)}`);
};
SUB['rp-filter'] = d => { store.set('rf', d.from); store.set('rt', d.to); store.set('rc', d.client_id || ''); route(); };
ACT['rp-csv'] = async el => { const f = {}; const fr = store.get('rf'), to = store.get('rt'), c = store.get('rc'); if (fr) f.from = fr; if (to) f.to = to; if (c) f.client_id = c; const r = await act('reports.export', { id: el.dataset.id, filters: f }); if (r) download(r.filename, r.csv); };
/* ===== administration ===== */
const AT = [['users', 'Users', 'user.manage'], ['perms', 'Permissions', 'user.manage'], ['settings', 'Settings', 'settings.manage'], ['masters', 'Masters & templates', 'settings.manage'], ['audit', 'Audit log', 'audit.view'], ['backup', 'Backup & triggers', 'backup.manage'], ['integrations', 'Integrations', 'settings.manage'], ['announce', 'Announcements', 'announce.post']];
ROUTES.admin = async (v, a) => {
  const tabs = AT.filter(t => has(t[2])); const tab = a[0] || (tabs[0] && tabs[0][0]);
  const head = html`<h1>Administration</h1><div class="tabs">${tabs.map(t => html`<a href="#/admin/${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]}</a>`)}</div>`;
  if (tab === 'users') {
    const d = await api('users.list', {});
    put(v, html`${head}<div class="bar"><button class="btn pri" data-act="us-new">+ Add user</button></div><div class="card" style="padding:0">${tbl([{ h: 'Name', k: 'full_name' }, { h: 'Email', k: 'email' }, { h: 'Role', f: r => S.enums.ROLES[r.role] }, { h: 'Status', f: r => r.is_active === 'N' ? badge('Deactivated', 'bad') : r.employment_status === 'Pending Approval' ? badge('Pending approval', 'warn') : !r.activated ? badge('Awaiting activation', 'warn') : r.locked ? badge('Locked', 'bad') : badge('Active', 'ok') }, { h: 'Last login', f: r => dmy(r.last_login) },
      { h: '', f: r => html`<button class="btn sm" data-act="us-edit" data-id="${r.user_id}">Edit</button> ${r.employment_status === 'Pending Approval' ? html`<button class="btn sm pri" data-act="us-approve" data-id="${r.user_id}">Approve</button> ` : ''}<button class="btn sm" data-act="us-access" data-id="${r.user_id}">Clients</button> <button class="btn sm" data-act="us-perm" data-id="${r.user_id}">Permissions</button> ${r.is_active === 'N' ? html`<button class="btn sm" data-act="us-react" data-id="${r.user_id}">Reactivate</button>` : html`<button class="btn sm" data-act="us-reset" data-id="${r.user_id}">Reset access</button> <button class="btn sm" data-act="us-deact" data-id="${r.user_id}">Deactivate</button>`}` }], d)}</div>`);
    cache.users = d;
  } else if (tab === 'perms') {
    const m = await api('perm.matrix', {}); const roles = Object.keys(m.roles);
    put(v, html`${head}<div class="banner">Role permissions are enforced on the server for every request. Changes apply to the next request. The Firm Administrator role always keeps every permission. Individual exceptions are set from <a href="#/admin/users">Users → Permissions</a>.</div>
     <div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>Permission</th>${roles.map(r => html`<th>${m.role_labels[r].split(' ')[0]}${r === 'SENIOR' ? ' / Rev.' : ''}</th>`)}</tr></thead><tbody>${Object.keys(m.perms).map(p => html`<tr><td>${m.perms[p]}<div class="small muted">${p}</div></td>${roles.map(r => html`<td><input type="checkbox" data-role="${r}" data-perm="${p}" ${m.roles[r].includes(p) ? raw('checked') : ''} ${r === 'ADMIN' ? raw('disabled') : ''}></td>`)}</tr>`)}</tbody></table></div></div>
     <div class="bar" style="margin-top:10px">${roles.filter(r => r !== 'ADMIN').map(r => html`<button class="btn" data-act="pm-save" data-role="${r}">Save ${m.role_labels[r].split(' ')[0]}</button>`)}</div>
     <h3>Individual exceptions</h3>${tbl([{ h: 'User', f: r => uname(r.user_id) }, { h: 'Permission', k: 'perm' }, { h: 'Effect', f: r => badge(r.effect, r.effect === 'DENY' ? 'bad' : 'ok') }, { h: 'Reason', k: 'reason' }], m.overrides || [], { empty: 'No individual exceptions.' })}`);
  } else if (tab === 'settings') {
    const d = await api('settings.get', {});
    put(v, html`${head}<form data-sub="set-save" class="card">${d.map(s => html`<div class="f"><label>${s.key} <span class="muted">— ${s.description}</span></label><input name="${s.key}" value="${s.value}"></div>`)}<button class="btn pri">Save settings</button></form>`);
  } else if (tab === 'masters') {
    const t = a[1] || 'ServiceCategories'; const tables = ['ServiceCategories', 'TaskTemplates', 'ChecklistTemplates', 'EmailTemplates', 'RecurringTaskRules'];
    const d = await api('master.list', { table: t }); const cols = d[0] ? Object.keys(d[0]).filter(k => !/^(created|updated)_|is_active/.test(k)).slice(0, 7) : [];
    put(v, html`${head}<div class="bar">${tables.map(x => html`<a class="btn ${x === t ? 'pri' : ''}" href="#/admin/masters/${x}">${x.replace(/([A-Z])/g, ' $1').trim()}</a>`)}<div class="sp"></div><button class="btn pri" data-act="ms-new" data-t="${t}">+ Add</button></div><div class="card" style="padding:0">${tbl([...cols.map(k => ({ h: pretty(k), f: r => String(r[k] == null ? '' : r[k]).slice(0, 80) })), { h: '', f: r => html`<button class="btn sm" data-act="ms-edit" data-t="${t}" data-i="${d.indexOf(r)}">Edit</button> <button class="btn sm" data-act="ms-del" data-t="${t}" data-i="${d.indexOf(r)}">Remove</button>` }], d)}</div>`);
    cache.master = d;
  } else if (tab === 'audit') {
    const f = { module: store.get('am') || '', action: store.get('aa') || '' }; const d = await api('audit.list', Object.assign({ limit: 300 }, f.module ? { module: f.module } : {}, f.action ? { action: f.action } : {}));
    put(v, html`${head}<form class="bar" data-sub="au-filter"><input name="module" placeholder="Module" value="${f.module}"><input name="action" placeholder="Action (e.g. DENIED)" value="${f.action}"><button class="btn">Filter</button></form><div class="banner">${d.note} Showing ${d.rows.length} of ${d.total}.</div><div class="card" style="padding:0">${tbl([{ h: 'Time', f: r => dmy(r.ts) }, { h: 'User', k: 'user_name' }, { h: 'Action', f: r => badge(r.action, r.status !== 'OK' ? 'bad' : '') }, { h: 'Module', k: 'module' }, { h: 'Record', f: r => r.record_type + ' ' + r.record_id }, { h: 'Before', f: r => String(r.previous_value || '').slice(0, 70) }, { h: 'After', f: r => String(r.new_value || '').slice(0, 70) }, { h: 'Reason', k: 'reason' }, { h: 'Result', k: 'status' }], d.rows)}</div>`);
  } else if (tab === 'backup') {
    const d = await api('backup.list', {});
    put(v, html`${head}<div class="banner">Backups copy the database spreadsheet inside Google Drive. They protect against mistakes, not against loss of the Google account. Document files in Drive and the script source are <b>not</b> included in a database backup; see the backup and restore guide.</div><div class="bar"><button class="btn pri" data-act="bk-db">Backup database now</button><button class="btn" data-act="bk-csv">Export all tables (CSV)</button><button class="btn" data-act="bk-inv">Document inventory</button><button class="btn" data-act="bk-cfg">Export configuration</button></div>
     <h3>Scheduled jobs</h3>${d.triggers.length ? tbl([{ h: 'Function', k: 'handler' }, { h: 'Type', k: 'type' }], d.triggers) : html`<div class="muted">No time-driven triggers installed. Daily reminders and weekly backups will not run until you install them.</div>`}<div class="bar" style="margin-top:8px"><button class="btn" data-act="tr-inst">Install / re-install triggers</button><button class="btn" data-act="tr-run">Run daily job now</button><button class="btn" data-act="tr-rem">Remove triggers</button></div>
     <h3>Backup log (retention ${d.retention} database copies)</h3><div class="card" style="padding:0">${tbl([{ h: 'Started', f: r => dmy(r.started_at) }, { h: 'Kind', k: 'kind' }, { h: 'Status', f: r => badge(r.status, r.status === 'OK' ? 'ok' : r.status === 'FAILED' ? 'bad' : '') }, { h: 'Detail', k: 'detail' }, { h: '', f: r => r.kind === 'DATABASE' && r.status === 'OK' ? html`<button class="btn sm" data-act="bk-ver" data-id="${r.target}">Verify</button>` : '' }], d.logs, { empty: 'No backups yet.' })}</div>`);
  } else if (tab === 'integrations') {
    const d = await api('master.list', { table: 'IntegrationRegister' });
    put(v, html`${head}<div class="banner">No external system other than Google Drive, Gmail and Google Sheets is connected. Everything marked Pending is a placeholder: nothing is sent to or read from these services. Before any is enabled, review its authentication, cost, data permissions and fallback below.</div><div class="card" style="padding:0">${tbl([{ h: 'Integration', k: 'integration' }, { h: 'Purpose', k: 'purpose' }, { h: 'Status', f: r => badge(r.status, r.status === 'Core platform service' ? 'ok' : r.status === 'Pending' ? 'warn' : '') }, { h: 'Fallback today', k: 'fallback_process' }], d)}</div>`);
  } else if (tab === 'announce') {
    put(v, html`${head}<form data-sub="an-post" class="card">${fld({ n: 'title', l: 'Title', req: 1 })}${fld({ n: 'message', l: 'Message', t: 'textarea', req: 1 })}${fld({ n: 'audience_role', l: 'Audience', t: 'select', opts: Object.keys(S.enums.ROLES).map(r => [r, S.enums.ROLES[r]]), blank: 'Everyone' })}${fld({ n: 'expires_on', l: 'Show until', t: 'date' })}<button class="btn pri">Post announcement</button></form>`);
  }
};
SUB['set-save'] = async d => { if (await act('settings.save', { values: d }, 'Settings saved')) route(); };
SUB['au-filter'] = d => { store.set('am', d.module); store.set('aa', d.action); route(); };
SUB['an-post'] = async d => { if (await act('announce.post', d, 'Announcement posted')) route(); };
const showCode = (title, name, email, code) => modal({ title, submit: null, body: html`<div class="banner ok"><b>${name}</b> (${email})<br>Give this one-time activation code to the user now. It is shown only once, expires in 3 days and is stored only as a hash.</div><div class="card" style="font-size:22px;letter-spacing:2px;text-align:center;font-weight:700;user-select:all">${code}</div><p class="small muted">The user opens the sign-in page, chooses "First time?", enters their email, this code and a new password.</p>` });
const userForm = u => { u = u || {}; return html`<div class="row2">${fld({ n: 'full_name', l: 'Full name', v: u.full_name, req: 1 })}${fld({ n: 'email', l: 'Email', t: 'email', v: u.email, req: 1 })}</div><div class="row2">${fld({ n: 'role', l: 'Role', t: 'select', opts: Object.keys(S.enums.ROLES).map(r => [r, S.enums.ROLES[r]]), v: u.role || 'CLERK', blank: undefined })}${fld({ n: 'partner_id', l: 'Reporting partner', t: 'select', opts: usersBy(['PARTNER', 'MANAGING_PARTNER']), v: u.partner_id, blank: '— none —' })}</div><div class="row3">${fld({ n: 'reporting_manager_id', l: 'Reporting manager', t: 'select', opts: S.dir.map(x => [x.user_id, x.full_name]), v: u.reporting_manager_id, blank: '— none —' })}${fld({ n: 'employee_code', l: 'Employee code', v: u.employee_code })}${fld({ n: 'department', l: 'Department', v: u.department })}</div><div class="row3">${fld({ n: 'joining_date', l: 'Joining date', t: 'date', v: u.joining_date })}${fld({ n: 'contact_number', l: 'Contact number', v: u.contact_number })}${fld({ n: 'client_access', l: 'Client visibility', t: 'select', opts: [['ASSIGNED', 'Only assigned clients'], ['ALL', 'All clients']], v: u.client_access || 'ASSIGNED', blank: undefined })}</div>`; };
ACT['us-approve'] = el => { const u = cache.users.find(x => x.user_id === el.dataset.id); modal({ title: 'Approve ' + u.full_name, body: html`<p class="small muted">${u.email}${u.department ? ' · ' + u.department : ''}. Choose the role this person will have. Access to clients is still granted separately.</p>${fld({ n: 'role', l: 'Role', t: 'select', opts: Object.keys(S.enums.ROLES).map(k => [k, S.enums.ROLES[k]]), v: u.role })}`, submit: 'Approve', onSubmit: async d => { await mcall('users.approve', { user_id: u.user_id, role: d.role }, 'User approved'); route(); } }); };
ACT['us-new'] = () => modal({ title: 'Add user', wide: 1, body: userForm(), onSubmit: async d => { const r = await mcall('users.save', d); route(); setTimeout(() => showCode('Activation code', r.user.full_name, r.user.email, r.activation_code), 50); } });
ACT['us-edit'] = el => { const u = cache.users.find(x => x.user_id === el.dataset.id); modal({ title: 'Edit user', wide: 1, body: html`<input type="hidden" name="user_id" value="${u.user_id}">${userForm(u)}`, onSubmit: async d => { await mcall('users.save', d, 'User updated'); route(); } }); };
ACT['us-reset'] = el => confirmBox('Reset access', 'This invalidates the current password and issues a new one-time activation code.', 'Reset', async () => { const r = await mcall('users.reset', { user_id: el.dataset.id }); const u = cache.users.find(x => x.user_id === el.dataset.id); route(); setTimeout(() => showCode('New activation code', u.full_name, u.email, r.activation_code), 50); });
ACT['us-deact'] = el => confirmBox('Deactivate user', 'The user is signed out immediately and cannot sign in. Their records are kept. Open tasks must be reassigned.', 'Deactivate', async d => { const r = await mcall('users.deactivate', { user_id: el.dataset.id, reason: d.reason }); toast(r.open_tasks_to_reassign ? 'Deactivated. ' + r.open_tasks_to_reassign + ' open task(s) need reassignment.' : 'Deactivated'); route(); }, true);
ACT['us-react'] = async el => { const r = await act('users.reactivate', { user_id: el.dataset.id }); if (r) { const u = cache.users.find(x => x.user_id === el.dataset.id); route(); setTimeout(() => showCode('Activation code', u.full_name, u.email, r.activation_code), 50); } };
ACT['us-access'] = async el => { const [cur, cl] = await Promise.all([api('users.getClientAccess', { user_id: el.dataset.id }), clientList(true)]); const have = new Set((cur || []).map(x => x.client_id || x)); modal({ title: 'Extra client access', wide: 1, body: html`<p class="small muted">Users always see clients they are assigned to. Tick additional clients this user may open.</p><div class="mx card" style="max-height:300px;overflow:auto">${cl.map(c => html`<label><input type="checkbox" data-multi="1" name="client_ids" value="${c.client_id}" ${have.has(c.client_id) ? raw('checked') : ''}> ${c.name}</label>`)}</div>`, onSubmit: async d => { await mcall('users.setClientAccess', { user_id: el.dataset.id, client_ids: d.client_ids || [] }, 'Access updated'); } }); };
ACT['us-perm'] = async el => {
  const m = await api('perm.matrix', {}); const u = cache.users.find(x => x.user_id === el.dataset.id); const ov = (m.overrides || []).filter(o => o.user_id === u.user_id); const cur = {}; ov.forEach(o => cur[o.perm] = o.effect);
  modal({ title: 'Individual permissions — ' + u.full_name, wide: 1, body: html`<p class="small muted">Role: ${S.enums.ROLES[u.role]}. An exception overrides the role for this person only. Choose "Role default" to remove an exception.</p><div class="tw"><table><tbody>${Object.keys(m.perms).map(p => html`<tr><td>${m.perms[p]} <span class="small muted">${p}</span><br><span class="small">${m.roles[u.role].includes(p) ? 'role grants this' : 'role does not grant this'}</span></td><td><select name="${p}">${opt([['', 'Role default'], ['GRANT', 'Grant'], ['DENY', 'Deny']], cur[p] || '')}</select></td></tr>`)}</tbody></table></div>${fld({ n: '__reason', l: 'Reason for change', req: 1 })}`,
    onSubmit: async d => { let n = 0; for (const p of Object.keys(m.perms)) { if ((d[p] || '') !== (cur[p] || '')) { await mcall('perm.setUser', { user_id: u.user_id, perm: p, effect: d[p] || '', reason: d.__reason }); n++; } } toast(n + ' change(s) saved'); } });
};
ACT['pm-save'] = async el => { const role = el.dataset.role; const perms = $$('[data-role="' + role + '"]').filter(x => x.checked).map(x => x.dataset.perm); if (!confirm('Save permissions for this role? ' + perms.length + ' permission(s) selected.')) return; if (await act('perm.setRole', { role, perms }, 'Role permissions saved')) route(); };
const mForm = (t, r) => { r = r || {}; const def = { ServiceCategories: ['code', 'name', 'category', 'description', 'default_est_hours'], TaskTemplates: ['name', 'service_id', 'title_pattern', 'description', 'instructions', 'est_hours', 'priority', 'requires_senior_review', 'requires_partner_approval', 'checklist', 'default_due_offset_days'], ChecklistTemplates: ['name', 'service_id', 'items'], EmailTemplates: ['code', 'name', 'subject', 'body', 'approval_level'], RecurringTaskRules: ['name', 'template_id', 'client_id', 'frequency', 'due_offset_days', 'start_date', 'end_date', 'partner_id', 'senior_id', 'clerk_id', 'status'] }[t]; const pk = { ServiceCategories: 'service_id', TaskTemplates: 'template_id', ChecklistTemplates: 'template_id', EmailTemplates: 'code', RecurringTaskRules: 'rule_id' }[t];
  return html`${r[pk] ? html`<input type="hidden" name="${pk}" value="${r[pk]}">` : ''}${def.map(k => fld({ n: k, l: pretty(k), v: r[k], t: /body|instructions|description|items|checklist/.test(k) ? 'textarea' : /date$/.test(k) ? 'date' : 'text', req: k === 'name' || (k === 'code' && !r[pk]) ? 1 : 0 }))}<p class="small muted">Checklist templates: items separated by semicolons; add |O for optional (e.g. "Bank statements;Purchase register|O").</p>`; };
ACT['ms-new'] = el => modal({ title: 'Add record', wide: 1, body: mForm(el.dataset.t), onSubmit: async d => { await mcall('master.save', { table: el.dataset.t, data: d }, 'Saved'); route(); } });
ACT['ms-edit'] = el => { const r = cache.master[+el.dataset.i]; modal({ title: 'Edit record', wide: 1, body: mForm(el.dataset.t, r), onSubmit: async d => { await mcall('master.save', { table: el.dataset.t, data: d }, 'Saved'); route(); } }); };
ACT['ms-del'] = el => { const r = cache.master[+el.dataset.i]; const pk = { ServiceCategories: 'service_id', TaskTemplates: 'template_id', ChecklistTemplates: 'template_id', EmailTemplates: 'code', RecurringTaskRules: 'rule_id' }[el.dataset.t]; confirmBox('Remove record', 'Remove "' + (r.name || r[pk]) + '"? It is hidden from lists; existing records that used it are unchanged.', 'Remove', async () => { await mcall('master.remove', { table: el.dataset.t, id: r[pk] }, 'Removed'); route(); }); };
ACT['bk-db'] = async el => { el.disabled = true; const r = await act('backup.db', {}, 'Backup created'); el.disabled = false; if (r) route(); };
ACT['bk-csv'] = async el => { el.disabled = true; const r = await act('backup.csv', {}, 'CSV export saved to Drive › System Exports'); el.disabled = false; if (r) route(); };
ACT['bk-inv'] = async el => { el.disabled = true; const r = await act('backup.inventory', {}); el.disabled = false; if (r) { toast('Inventory of ' + r.count + ' file(s) saved to Drive'); route(); } };
ACT['bk-cfg'] = async el => { const r = await act('backup.config', {}, 'Configuration exported to Drive'); if (r) route(); };
ACT['bk-ver'] = async el => { const r = await act('backup.verify', { file_id: el.dataset.id }); if (r) modal({ title: 'Backup verification', submit: null, body: html`<div class="banner ${r.structure_ok ? 'ok' : 'bad'}">${r.structure_ok ? 'All tabs are present in the backup copy.' : 'Some tabs are missing from the backup copy.'}</div>${tbl([{ h: 'Tab', k: 'tab' }, { h: 'Backup rows', k: 'backup' }, { h: 'Live rows', k: 'live' }], r.differences, { empty: 'Row counts match the live database.' })}<p class="small muted">${r.note}</p>` }); route(); };
ACT['tr-inst'] = async () => { const r = await act('jobs.install', {}, 'Triggers installed'); if (r) route(); };
ACT['tr-rem'] = async () => { const r = await act('jobs.remove', {}, 'Triggers removed'); if (r !== undefined) route(); };
ACT['tr-run'] = async el => { el.disabled = true; const r = await act('jobs.runNow', {}); el.disabled = false; if (r) toast('Daily job done: ' + (r.recurring ? r.recurring.created.length : 0) + ' recurring task(s) created, ' + r.reminders + ' reminder(s), ' + r.autoStopped + ' timer(s) auto-stopped'); };
boot();
</script>
</body>
</html>
