async function taskDetail(v, id) {

  const btn = (act, label, cls, extra) => html`<button class="btn ${cls || ''}" data-act="${act}" data-id="${id}" ${extra ? raw(extra) : ''}>${label}</button>`;
  const work = [];
  if (can.work) {
    if (st === 'Assigned') work.push(btn('t-ack', 'Acknowledge', 'pri'));
    if (['Assigned', 'Acknowledged', 'Not Started', 'Waiting for Client Documents', 'Blocked', 'Correction Required', 'On Hold'].includes(st)) work.push(btn('t-status', 'Start / resume work', 'pri', 'data-to="In Progress"'));
    if (st === 'In Progress' || st === 'Correction Required') work.push(btn('t-submit', st === 'Correction Required' ? 'Resubmit for review' : 'Submit for review', 'gold'));
    if (st === 'In Progress') work.push(btn('t-status', 'Waiting for client documents', '', 'data-to="Waiting for Client Documents" data-ask="1"'), btn('t-status', 'Blocked', '', 'data-to="Blocked" data-ask="1"'));
    if (['In Progress', 'Waiting for Client Documents'].includes(st)) work.push(btn('t-status', 'On hold', '', 'data-to="On Hold" data-ask="1"'));
    if (['In Progress', 'Acknowledged', 'Not Started', 'Assigned'].includes(st)) work.push(btn('t-timer', '▶ Start timer', ''));
  }
  if (can.review && ['Submitted for Review', 'Under Review', 'Resubmitted'].includes(st)) work.push(btn('t-review', 'Review', 'gold'));
  if (can.manage) { if (st === 'Approved') work.push(btn('t-status', 'Mark completed', 'pri', 'data-to="Completed"')); if (st === 'Completed') work.push(btn('t-status', 'Reopen', '', 'data-to="In Progress" data-ask="1"')); work.push(btn('t-assign', 'Allocate / reassign'), btn('t-edit', 'Edit'), btn('t-instr', 'Instruction')); if (!['Completed', 'Cancelled'].includes(st)) work.push(btn('t-status', 'Cancel task', 'bad', 'data-to="Cancelled" data-ask="1"')); }

   <div class="bar">${work}</div>
   <div class="grid g2"><div class="card"><h2>Details</h2><dl class="kv"><dt>Client</dt><dd>${d.client ? html`<a href="#/clients/${d.client.client_id}">${d.client.name}</a>` : ''}</dd><dt>Due date</dt><dd>${dmy(t.due_date)}</dd><dt>FY / AY</dt><dd>${t.fy} / ${t.ay}</dd><dt>Partner</dt><dd>${uname(t.partner_id)}</dd><dt>Senior</dt><dd>${uname(t.senior_id)}</dd><dt>Estimated</dt><dd>${t.est_hours} h (logged ${d.logged_hours} h)</dd><dt>Submissions</dt><dd>${t.submission_no}</dd><dt>Description</dt><dd>${t.description}</dd></dl>
     <h3>Assigned to</h3>${d.assignments.filter(a => !a.released_at).map(a => html`<div>${a.name} ${badge(a.role_in_task, 'info')} <span class="small muted">${a.ack_at ? 'ack ' + dmy(a.ack_at) : 'not acknowledged'}</span></div>`)}
     ${d.assignments.some(a => a.released_at) ? html`<details class="small"><summary>Previous assignments</summary>${d.assignments.filter(a => a.released_at).map(a => html`<div>${a.name} until ${dmy(a.released_at)} — ${a.reason}</div>`)}</details>` : ''}</div>
    <div class="card"><h2>Instructions</h2>${d.instructions.length ? d.instructions.slice().reverse().map((i, ix) => html`<div style="margin-bottom:8px"><div class="small muted">v${i.version} · ${i.author_name} · ${dmy(i.created_at)} ${i.urgent === 'Y' ? badge('Urgent', 'bad') : ''}${ix ? '' : ' (current)'}</div><div>${i.text}</div>${i.version > 1 ? html`<div class="small muted">Reason: ${i.reason}</div>` : ''}${i.expected_deliverable ? html`<div class="small">Deliverable: ${i.expected_deliverable}</div>` : ''}</div>`) : html`<div class="muted">No instructions recorded.</div>`}</div></div>
   <div class="grid g2"><div class="card"><h2>Checklist</h2>${d.checklist.map(c => html`<div><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" data-act="t-chk" data-id="${c.item_id}" ${c.done === 'Y' ? raw('checked') : ''} ${can.work || can.manage ? '' : raw('disabled')}> ${c.text} ${c.mandatory === 'Y' ? badge('mandatory', 'warn') : ''}</label></div>`)}${d.checklist.length ? '' : html`<div class="muted">No checklist.</div>`}${can.manage ? html`<button class="btn sm" data-act="t-chk-add" data-id="${id}">+ Item</button>` : ''}
     <h3>Dependencies</h3>${d.dependencies.map(x => html`<div>${x.task_no} ${x.title} ${badge(x.status)} ${can.manage ? html`<button class="btn sm" data-act="t-dep-del" data-id="${x.id}">×</button>` : ''}</div>`)}${can.manage ? html`<button class="btn sm" data-act="t-dep-add" data-id="${id}">+ Dependency</button>` : ''}</div>
    <div class="card"><h2>Reviews</h2>${d.reviews.length ? tbl([{ h: 'Stage', k: 'stage' }, { h: 'Outcome', f: r => badge(r.outcome) }, { h: 'By', k: 'reviewer_name' }, { h: 'Remarks', k: 'remarks' }, { h: 'When', f: r => dmy(r.created_at) }], d.reviews) : html`<div class="muted">No reviews yet.</div>`}</div></div>

}

  const [cl, tp] = await Promise.all([clientList(), api('master.list', { table: 'EmailTemplates' })]);
  modal({ title: 'Draft client email', wide: 1, body: html`<div class="row2">${fld({ n: 'client_id', l: 'Client', t: 'select', opts: clientOpts(cl), req: 1 })}${fld({ n: 'template_code', l: 'Template', t: 'select', opts: tp.map(t => [t.code, t.name + ' (approval: ' + t.approval_level + ')']), blank: '— write my own —' })}</div><div class="row2">${fld({ n: 'to_email', l: 'To (defaults to the client email)', t: 'email' })}${fld({ n: 'cc_email', l: 'Cc', t: 'email' })}</div>${fld({ n: 'subject', l: 'Subject (leave blank to use the template)' })}${fld({ n: 'body', l: 'Message (leave blank to use the template)', t: 'textarea', rows: 6 })}<p class="small muted">Placeholders such as {{client_name}} are filled from the client and task. Any {{placeholder}} left unfilled must be fixed before submission.</p>`,
    onSubmit: async d => { ['to_email', 'cc_email', 'subject', 'body', 'template_code'].forEach(k => { if (!d[k]) delete d[k]; }); const q = await mcall('mail.draft', d, 'Draft saved'); if (q.warnings && q.warnings.length) toast(q.warnings.join(' '), true); route(); } });
};
ACT['em-view'] = el => { const q = (cache.mailRows || []).find(x => x.queue_id === el.dataset.id); modal({ title: q.subject, submit: null, wide: 1, body: html`<dl class="kv"><dt>To</dt><dd>${q.to_email} ${q.cc_email ? '(cc ' + q.cc_email + ')' : ''}</dd><dt>Status</dt><dd>${badge(q.status)} ${q.sent_at ? dmy(q.sent_at) : ''}</dd><dt>Approval</dt><dd>${q.approval_level}${q.approved_by ? ' · by ' + uname(q.approved_by) : ''}</dd></dl><div class="card" style="white-space:pre-wrap">${q.body}</div>` }); };
ACT['em-edit'] = el => { const q = cache.mailRows.find(x => x.queue_id === el.dataset.id); modal({ title: 'Edit draft', wide: 1, body: html`${fld({ n: 'to_email', l: 'To', v: q.to_email })}${fld({ n: 'subject', l: 'Subject', v: q.subject })}${fld({ n: 'body', l: 'Message', t: 'textarea', rows: 8, v: q.body })}`, onSubmit: async d => { await mcall('mail.edit', Object.assign(d, { queue_id: q.queue_id }), 'Saved'); route(); } }); };
ACT['em-sub'] = async el => { if (await act('mail.submit', { queue_id: el.dataset.id }, 'Submitted')) route(); };
ACT['em-ok'] = async el => { if (await act('mail.decide', { queue_id: el.dataset.id, approve: true }, 'Approved')) route(); };
ACT['em-no'] = el => modal({ title: 'Reject email', body: fld({ n: 'remarks', l: 'Reason', t: 'textarea', req: 1 }), onSubmit: async d => { await mcall('mail.decide', { queue_id: el.dataset.id, approve: false, remarks: d.remarks }); route(); } });
ACT['em-send'] = el => confirmBox('Send email', 'This sends the approved email from the firm\'s Gmail account now. It cannot be recalled.', 'Send now', async () => { const r = await mcall('mail.send', { queue_id: el.dataset.id }); toast(r.status === 'SENT' ? 'Email sent' : (r.error || 'Send failed'), r.status !== 'SENT'); route(); });
/* ===== compliance ===== */
ROUTES.compliance = async (v, a) => {
  const tab = a[0] || 'records', head = html`<div class="bar"><h1>Compliance calendar</h1><div class="sp"></div>${has('compliance.manage') && tab === 'calendar' ? html`<button class="btn pri" data-act="cc-new">+ Due date</button>` : ''}</div><div class="tabs">${[['records', 'Client filings'], ['calendar', 'Due-date calendar']].map(t => html`<a href="#/compliance/${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]}</a>`)}</div>`;
  if (tab === 'calendar') {
    const d = await api('comp.cal.list', {});
    put(v, html`${head}<div class="banner">Due dates are maintained by the administrator or a partner and are <b>not</b> built into the software. An entry marked <b>UNVERIFIED</b> has not been checked against the official notification; verify it (recording the source) before relying on it. Always confirm statutory due dates and extensions on the official portals.</div><div class="card" style="padding:0">${tbl([{ h: 'Category', k: 'category' }, { h: 'Compliance', k: 'name' }, { h: 'Period', k: 'period_label' }, { h: 'Due date', f: r => dmy(r.due_date) }, { h: 'Extension (days)', k: 'adjust_days', cls: 'num' }, { h: 'Effective due', f: r => html`<b>${dmy(r.effective_due)}</b>` }, { h: 'Status', f: r => badge(r.status) }, { h: 'Source', k: 'source_note' },
     { h: '', f: r => has('compliance.manage') ? html`<button class="btn sm" data-act="cc-edit" data-id="${r.calendar_id}">Edit</button> <button class="btn sm" data-act="cc-ver" data-id="${r.calendar_id}">Verify</button> <button class="btn sm" data-act="cc-gen" data-id="${r.calendar_id}">Create client filings</button>` : '' }], d, { empty: 'No due dates entered yet.' })}</div>`);
    cache.cal = d;
  } else {
    const f = store.get('cf') || ''; const d = await api('comp.rec.list', f === 'overdue' ? { overdue: true } : f ? { status: f } : {});
    put(v, html`${head}<div class="tabs" style="margin-top:-6px">${[['', 'All'], ['overdue', 'Overdue'], ['Pending', 'Pending'], ['In Progress', 'In progress'], ['Filed', 'Filed']].map(t => html`<a href="#" data-act="cr-f" data-f="${t[0]}" class="${f === t[0] ? 'on' : ''}">${t[1]}</a>`)}</div><div class="card" style="padding:0">${tbl([{ h: 'Client', k: 'client_name' }, { h: 'Compliance', f: r => html`${r.calendar_name} ${r.verified ? '' : badge('due date unverified', 'warn')}` }, { h: 'Period', k: 'period_label' }, { h: 'Due', f: r => html`<span class="${r.overdue ? 'err' : ''}">${dmy(r.due_date)}</span>` }, { h: 'Owner', k: 'responsible_name' }, { h: 'Status', f: r => badge(r.status) }, { h: 'Ack / ref', k: 'ack_no' },
      { h: '', f: r => html`<button class="btn sm" data-act="cr-upd" data-id="${r.record_id}" data-s="${r.status}" data-a="${r.ack_no}" data-fd="${r.filed_date}">Update</button> ${!r.task_id && has('task.create') ? html`<button class="btn sm" data-act="cr-task" data-id="${r.record_id}">Create task</button>` : r.task_id ? html`<a class="btn sm" href="#/tasks/${r.task_id}">Task</a>` : ''}` }], d.rows, { empty: 'No client filings. Add a due date, then use "Create client filings".' })}</div>`);
  }
};
ACT['cr-f'] = el => { store.set('cf', el.dataset.f); route(); };
const ccForm = c => { c = c || {}; return html`<div class="row2">${fld({ n: 'category', l: 'Category', t: 'select', opts: S.enums.COMPLIANCE_CATEGORIES, v: c.category, blank: undefined })}${fld({ n: 'name', l: 'Compliance / form', v: c.name, req: 1 })}</div><div class="row3">${fld({ n: 'form_ref', l: 'Form / return', v: c.form_ref })}${fld({ n: 'period_label', l: 'Period (e.g. Oct 2026)', v: c.period_label })}${fld({ n: 'fy', l: 'FY', v: c.fy || '2026-27' })}</div><div class="row2">${fld({ n: 'due_date', l: 'Statutory due date', t: 'date', v: c.due_date, req: 1 })}${fld({ n: 'adjust_days', l: 'Extension (days, +/-)', t: 'number', v: c.adjust_days || 0 })}</div>${fld({ n: 'source_note', l: 'Source (notification / portal notice)', v: c.source_note })}<p class="small muted">Saving a changed date marks the entry UNVERIFIED until it is verified again.</p>`; };
ACT['cc-new'] = () => modal({ title: 'Add due date', body: ccForm(), onSubmit: async d => { await mcall('comp.cal.save', d, 'Saved (unverified)'); route(); } });
ACT['cc-edit'] = el => { const c = cache.cal.find(x => x.calendar_id === el.dataset.id); modal({ title: 'Edit due date', body: html`<input type="hidden" name="calendar_id" value="${c.calendar_id}">${ccForm(c)}`, onSubmit: async d => { await mcall('comp.cal.save', d, 'Saved'); route(); } }); };
ACT['cc-ver'] = el => { const c = cache.cal.find(x => x.calendar_id === el.dataset.id); modal({ title: 'Verify due date', body: html`<p>${c.name} · ${c.period_label} · effective due <b>${dmy(c.effective_due)}</b></p>${fld({ n: 'note', l: 'Authoritative source used to verify (required)', v: c.source_note, req: 1 })}`, submit: 'Mark verified', onSubmit: async d => { await mcall('comp.verify', { calendar_id: c.calendar_id, note: d.note }, 'Verified'); route(); } }); };
ACT['cc-gen'] = async el => { const r = await act('comp.generate', { calendar_id: el.dataset.id }); if (r) { toast(r.created + ' filing(s) created, ' + r.skipped + ' already existed'); go('compliance/records'); } };
ACT['cr-upd'] = el => modal({ title: 'Update filing status', body: html`${fld({ n: 'status', l: 'Status', t: 'select', opts: ['Pending', 'Docs Awaited', 'In Progress', 'Filed', 'Not Applicable'], v: el.dataset.s, blank: undefined })}<div class="row2">${fld({ n: 'filed_date', l: 'Filed on', t: 'date', v: el.dataset.fd })}${fld({ n: 'ack_no', l: 'Acknowledgement / ARN', v: el.dataset.a })}</div>${fld({ n: 'remarks', l: 'Remarks' })}<p class="small muted">"Filed" needs a filing date and an acknowledgement number.</p>`, onSubmit: async d => { await mcall('comp.rec.update', Object.assign(d, { record_id: el.dataset.id }), 'Updated'); route(); } });
ACT['cr-task'] = async el => { const r = await act('comp.rec.task', { record_id: el.dataset.id }, 'Task created'); if (r) go('tasks/' + r.task_id); };
/* ===== reports ===== */
function reportTable(r) {
  const fmt = (c, row) => { const x = row[c.key]; if (x == null) return ''; if (c.type === 'money') return inr(x); if (c.type === 'date') return dmy(x); if (/status$/i.test(c.key) || c.key === 'priority') return badge(x); return x; };
  return html`<div class="card"><h2>${r.title}</h2><div class="small muted">Generated ${dmy(r.generated)} by ${r.generated_by}</div>${tbl(r.columns.map(c => ({ h: c.label, f: row => fmt(c, row), cls: c.type === 'money' || c.type === 'num' ? 'num' : '' })), r.rows, { empty: 'No rows for this report.' })}${(r.notes || []).map(n => html`<div class="small muted" style="margin-top:6px">• ${n}</div>`)}</div>`;
}

const HELP = {"guide":[{"id":"intro","title":"Overview","html":"\u003cp>This guide covers every screen of the application, for every role. The same text is available inside the application under \u003cb>Help\u003c/b> in the left menu. Error messages are explained in the \u003ci>Error codes\u003c/i> section and in \u003ccode>ERROR_CODES.md\u003c/code>.\u003c/p>"},{"id":"getting-started","title":"Getting started","html":"\u003cp>\u003cb>Opening the application.\u003c/b> Use the web address your firm gives you (for example \u003ccode>https://tools.complypro.co.in/ca-office-manager/\u003c/code>). Use a current version of Chrome, Edge, Firefox or Safari. Nothing needs to be installed.\u003c/p>\u003cp>\u003cb>Creating your own account (self-registration).\u003c/b> If your firm has registration open:\u003c/p>\u003col>\u003cli>On the sign-in card choose \u003cb>New here? Create an account\u003c/b>.\u003c/li>\u003cli>Enter your full name and email address (mobile number and firm name are optional; a mobile number must be 10 digits), tick the consent box and press \u003cb>Register\u003c/b>.\u003c/li>\u003cli>The system emails an \u003cb>activation key\u003c/b> to that address from the firm's sender address (info@techmincsc.in). Check Spam or Junk if it does not arrive within a few minutes. If the key is lost or expired, open \u003ci>First time? Activate your account\u003c/i> and use the link there to have a new key sent.\u003c/li>\u003cli>Choose \u003cb>First time? Activate your account\u003c/b>, enter your email, the activation key and a new password.\u003c/li>\u003cli>Where the firm requires approval (the default), your account shows \u003ci>Pending approval\u003c/i> and you cannot sign in until the administrator approves it. You will receive an approval email.\u003c/li>\u003c/ol>\u003cp>The activation key works once and expires after 3 days. It is stored only as a one-way hash, so nobody (including the administrator) can read it.\u003c/p>\u003cp>\u003cb>Accounts created by the administrator.\u003c/b> The administrator gives you an activation key privately. Use \u003cb>First time? Activate your account\u003c/b> with your email, that key and a new password.\u003c/p>\u003cp>\u003cb>Password rules.\u003c/b> At least 10 characters, with an upper-case letter, a lower-case letter and a digit, and it must not contain the first part of your email address.\u003c/p>\u003cp>\u003cb>Signing in.\u003c/b> Email and password. After 5 wrong passwords the account is locked for 15 minutes. A session ends after about 6 hours; sign in again when asked.\u003c/p>\u003cp>\u003cb>Forgot your password.\u003c/b> Ask the administrator to use \u003cb>Reset access\u003c/b> on your user record. You receive a new activation key and set a new password with it.\u003c/p>\u003cp>\u003cb>Changing your password.\u003c/b> Top bar → your name (opens \u003ci>My account\u003c/i>) → fill in the \u003ci>Change password\u003c/i> boxes. You need the current password.\u003c/p>\u003cp>\u003cb>Signing out.\u003c/b> Always use \u003cb>Sign out\u003c/b> on a shared computer.\u003c/p>\u003cp>\u003cb>Alerts.\u003c/b> The \u003cb>Alerts\u003c/b> button in the top bar lists reminders (deadlines, reviews waiting, leave decisions, files to acknowledge). Opening an alert takes you to the record; \u003cb>Mark all as read\u003c/b> clears the list.\u003c/p>"},{"id":"roles-and-permissions","title":"Roles and permissions","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Typical work\u003c/th>\u003cth>What the menu shows\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Firm Administrator\u003c/b>\u003c/td>\u003ctd>Users, permissions, settings, backups, compliance calendar; sees everything\u003c/td>\u003ctd>Everything, including Administration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Managing Partner\u003c/b>\u003c/td>\u003ctd>Oversees all clients, fees, staff and approvals\u003c/td>\u003ctd>All work and office screens, reports, most administration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Partner\u003c/b>\u003c/td>\u003ctd>Own clients: allocate work, review and approve, bill, follow up fees, approve client email\u003c/td>\u003ctd>Clients, tasks, fees, files, documents, email, compliance, team reports\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Senior / Reviewer\u003c/b>\u003c/td>\u003ctd>Allocate and review work, draft emails\u003c/td>\u003ctd>Clients and tasks they handle, time, documents, reports\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Articled Clerk\u003c/b>\u003c/td>\u003ctd>Do assigned work, log time, upload documents\u003c/td>\u003ctd>Own tasks, time and leave, documents\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Accounts / Office Administrator\u003c/b>\u003c/td>\u003ctd>Invoices, receipts, fee follow-up, physical files\u003c/td>\u003ctd>Clients (read), fees, files, documents, compliance (read)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The menu only shows what you may open, and the server checks again on every action. If you reach something you may not use you see error \u003cb>FORBIDDEN\u003c/b>. The administrator can grant or deny single permissions for a role or a person (Administration → Permissions).\u003c/p>\u003cp>The permission list is: manage users; manage settings; view / edit / import clients; see full PAN-GSTIN-TAN; view / create / assign / bulk-edit tasks; work on tasks; review; approve; manage recurring tasks; write instructions; log time; view team time; correct time; team and firm reports; view / edit fees; record receipts; fee follow-ups; view / edit physical files; view / upload documents; draft / approve / send client email; view team attendance; approve leave; view / manage compliance; post announcements; view audit log; manage backups and triggers.\u003c/p>"},{"id":"dashboard","title":"Dashboard","html":"\u003cp>The first screen after sign-in. Tiles show your open work, work due soon, overdue work, items waiting for your review and (if you have fee access) outstanding fees. Click a tile to open the matching list. Announcements posted by partners appear here. Partners and the administrator also see firm-level numbers.\u003c/p>"},{"id":"clients","title":"Clients","html":"\u003cp>\u003cb>Finding a client.\u003c/b> \u003ci>Clients\u003c/i> → type in the search box (name, code, PAN) and choose a status.\u003c/p>\u003cp>\u003cb>Adding a client.\u003c/b> \u003ci>Add client\u003c/i>. Required: name and entity type. Optional: PAN, GSTIN, TAN, CIN/LLPIN, address, state, contact person, email, mobile, partner / senior / clerk in charge, financial year, engagement dates, agreed fee, billing frequency, renewal date, internal remarks. The system checks the format of PAN, GSTIN, TAN and email, and refuses duplicates of PAN, GSTIN, or the same name and entity type (error \u003cb>DUPLICATE\u003c/b>).\u003c/p>\u003cp>\u003cb>Sensitive identifiers.\u003c/b> PAN, GSTIN, TAN, CIN and mobile are masked unless you hold \u003ci>See full identifiers\u003c/i>. Only holders of that permission can change them.\u003c/p>\u003cp>\u003cb>Client page.\u003c/b> Tabs: Overview, Tasks, Contacts, Services (with financial year and fee), Fees (if you may see fees), Documents, Files and Emails. \u003ci>Add contact\u003c/i> records people at the client; one is primary and receives emails. \u003ci>Add service\u003c/i> attaches a service category to a financial year; the same service cannot be added twice for one year.\u003c/p>\u003cp>\u003cb>Pipeline stage.\u003c/b> Move a client through Lead → Contacted → Proposal sent → Awaiting confirmation → Engagement accepted → Onboarding pending → Active client → Temporarily inactive → Closed, with a note. Each change is kept in history.\u003c/p>\u003cp>\u003cb>Import and export.\u003c/b> \u003ci>Import CSV\u003c/i> first runs a \u003cb>dry run\u003c/b> that lists every row with the problem found; fix the file and run again, then confirm. \u003ci>Export CSV\u003c/i> downloads clients you may see. Cells that start with \u003ccode>=\u003c/code>, \u003ccode>+\u003c/code>, \u003ccode>-\u003c/code> or \u003ccode>@\u003c/code> are neutralised on export so a spreadsheet cannot run them.\u003c/p>\u003cp>\u003cb>Access.\u003c/b> Staff see clients they are assigned to (partner, senior, clerk in charge, or extra access given by the administrator). Partners with \u003ci>All clients\u003c/i> access see every client.\u003c/p>"},{"id":"tasks","title":"Tasks","html":"\u003cp>\u003cb>Task lifecycle.\u003c/b> Draft → Assigned → Acknowledged → Not started → In progress → (Waiting for client documents / Blocked / On hold) → Submitted for review → Under review → Correction required → Resubmitted → Approved → Completed. A task can also be Cancelled with a reason.\u003c/p>\u003cp>\u003cb>Creating a task.\u003c/b> \u003ci>Tasks → New task\u003c/i>. Required: client, title and due date. Choose service, priority (Low, Medium, High, Urgent), partner, senior, estimated hours and whether senior review and partner approval are required. Add written instructions and a checklist. A \u003cb>template\u003c/b> fills most of these.\u003c/p>\u003cp>\u003cb>Allocating.\u003c/b> \u003ci>Allocate\u003c/i> chooses the primary assignee and team members. If a person already has more open estimated hours than their two-week capacity you get a \u003cb>workload warning\u003c/b> (code OVERLOAD); read it, then confirm to assign anyway. Changing the assignee or the due date asks for a reason, which is kept in the task history.\u003c/p>\u003cp>\u003cb>Working on a task (assignee).\u003c/b>\u003c/p>\u003col>\u003cli>\u003ci>Acknowledge\u003c/i> the assignment.\u003c/li>\u003cli>Read \u003cb>Instructions\u003c/b> (later revisions are versioned; the previous text is kept) and the \u003cb>Checklist\u003c/b>.\u003c/li>\u003cli>Set the status to \u003ci>In progress\u003c/i>; use \u003cb>Start timer\u003c/b> to record time.\u003c/li>\u003cli>If you are waiting for the client, choose \u003ci>Waiting for client documents\u003c/i> and give a note. \u003ci>Blocked\u003c/i> and \u003ci>On hold\u003c/i> also need a reason.\u003c/li>\u003cli>Tick checklist items. Items marked \u003cb>mandatory\u003c/b> must be ticked before you can submit.\u003c/li>\u003cli>\u003cb>Submit for review\u003c/b> with a note. Status becomes \u003ci>Submitted for review\u003c/i>.\u003c/li>\u003c/ol>\u003cp>\u003cb>Reviewing.\u003c/b> \u003ci>Tasks → Awaiting review\u003c/i>. Outcomes: \u003cb>Approved\u003c/b>, \u003cb>Correction required\u003c/b>, \u003cb>More information required\u003c/b>, \u003cb>On hold\u003c/b>, \u003cb>Rejected\u003c/b>. Remarks are mandatory except for Approved. You cannot review work assigned to you. Where both are required, the senior reviews first and then the partner. After \u003ci>Correction required\u003c/i> the assignee fixes the work and chooses \u003cb>Resubmit\u003c/b>; the submission number goes up and every review round is kept.\u003c/p>\u003cp>\u003cb>Dependencies.\u003c/b> A task can depend on others. It cannot be completed before they are. A circular chain is refused.\u003c/p>\u003cp>\u003cb>Comments.\u003c/b> Comment, note, question, reply and review comments; mention people with \u003ccode>@name\u003c/code>. \u003ci>Internal\u003c/i> comments are never shown to clients. Attach documents from the Documents screen.\u003c/p>\u003cp>\u003cb>Bulk actions.\u003c/b> Select several tasks, then \u003ci>Bulk reassign\u003c/i>, \u003ci>Change due date\u003c/i> or \u003ci>Bulk create\u003c/i> (one task for each client in a list). Bulk actions need the bulk permission and ask for a reason.\u003c/p>\u003cp>\u003cb>Recurring tasks.\u003c/b> Administration → Masters → \u003ci>Recurring rules\u003c/i>: choose a template, client, frequency (daily, weekly, monthly, quarterly, half-yearly, annual), start date, due offset and people. The daily job creates each period's task once. \u003ci>Generate now\u003c/i> runs it on demand.\u003c/p>\u003cp>\u003cb>Task history.\u003c/b> The \u003ci>History\u003c/i> tab lists every status change, reassignment, instruction revision and review with who and when. It cannot be edited.\u003c/p>"},{"id":"time-and-leave","title":"Time and leave","html":"\u003cp>\u003cb>Timer.\u003c/b> \u003ci>Time &amp; leave\u003c/i> → pick a task (or a non-task category such as meeting, training, client visit, admin, document collection, break, other) → \u003cb>Start\u003c/b>. You can time only tasks assigned to you, and not closed ones. Starting the timer on a task that is still \u003ci>Assigned\u003c/i>, \u003ci>Acknowledged\u003c/i> or \u003ci>Not started\u003c/i> moves it to \u003ci>In progress\u003c/i>. Only one timer can run at a time: if one is running you must \u003cb>Stop\u003c/b> or \u003cb>Pause\u003c/b> it first, otherwise you see \u003ci>A timer is already running\u003c/i>. \u003cb>Resume\u003c/b> continues a paused timer. \u003cb>Stop\u003c/b> when you finish. A timer left running after midnight is stopped automatically at 23:59 and you are told; request a correction if the real time was different.\u003c/p>\u003cp>\u003cb>Manual entry.\u003c/b> \u003ci>Manual entry\u003c/i> for work you forgot to time: date, start and end (HH:MM), category, description. Refused: a future date or end time, an entry older than 31 days (ask a manager to correct it instead), an end before the start, an entry longer than 16 hours, and any overlap with an existing log.\u003c/p>\u003cp>\u003cb>Corrections.\u003c/b> \u003ci>Correct\u003c/i> on a log opens a request with the new times and a reason. A partner approves or rejects it; a partner with the correct-time permission can change an entry directly (the reason is mandatory and the original values are kept).\u003c/p>\u003cp>\u003cb>Attendance.\u003c/b> \u003ci>Check in\u003c/i> and \u003ci>Check out\u003c/i> once a day. Corrections need a reason and approval by a partner.\u003c/p>\u003cp>\u003cb>Leave.\u003c/b> \u003ci>Apply\u003c/i> with type (Casual, Sick, Earned, Study, Exam, Loss of pay, Other), dates and reason. Working days exclude your firm's weekly off days and holidays. The approver accepts or rejects with a reason; you may cancel a pending request. \u003cb>Balances\u003c/b> show quota, used and remaining per type where the firm has set a quota.\u003c/p>\u003cp>\u003cb>My productivity.\u003c/b> Hours logged by task and category over a date range, compared with scheduled hours. \u003ci>Unallocated time\u003c/i> is scheduled time minus approved leave minus logged time; it is a planning figure and \u003cb>not\u003c/b> a measure of idleness.\u003c/p>"},{"id":"compliance-calendar","title":"Compliance calendar","html":"\u003cp>\u003cb>Calendar.\u003c/b> An administrator or partner enters the compliance items with category, name, form, period, financial year, due date and an optional extension in days (a government extension). Each item is \u003cb>UNVERIFIED\u003c/b> until someone checks it against the official notification and presses \u003cb>Verify\u003c/b> with a note. Do not rely on UNVERIFIED dates.\u003c/p>\u003cp>\u003cb>Client filings.\u003c/b> \u003ci>Create client filings\u003c/i> makes one line for every client that has the matching service. Update the status (Pending, Docs awaited, In progress, Filed, Not applicable), filing date and acknowledgement number; \u003cb>Filed\u003c/b> needs both date and acknowledgement. \u003ci>Create task\u003c/i> turns a filing into a work item with the right people.\u003c/p>\u003cp>\u003cb>Reminders.\u003c/b> The daily job notifies the responsible person when a filing is due within twice the reminder days or overdue.\u003c/p>"},{"id":"fees-and-receipts","title":"Fees and receipts","html":"\u003cp>\u003cb>Fee agreements.\u003c/b> \u003ci>Fees → Agreements\u003c/i>: client, service, agreed fee, billing frequency, effective and renewal dates, tax treatment, payment terms.\u003c/p>\u003cp>\u003cb>Invoices.\u003c/b> \u003ci>New invoice\u003c/i>: client, type (Tax or Proforma), date, due date, service description and lines. Tax is worked out by the server from the firm's state and the client's state (CGST+SGST or IGST) at the default rate set by the administrator. Save as \u003cb>Draft\u003c/b>, check, then \u003cb>Issue\u003c/b> - this assigns the next number and locks the invoice. Issued invoices cannot be edited. Use a \u003cb>credit note\u003c/b>, \u003cb>write-off\u003c/b> or \u003cb>debit adjustment\u003c/b> (with a reason), or \u003cb>Cancel invoice\u003c/b> (reverse allocated receipts first). Proforma invoices and drafts are never counted as outstanding.\u003c/p>\u003cp>\u003cb>Receipts.\u003c/b> \u003ci>Record receipt\u003c/i>: client, date, amount, mode (bank transfer, UPI, cheque, cash, card, other), transaction reference. A repeated transaction reference is refused. Allocate to one or more invoices now or later; an amount not yet allocated stays as an advance. You cannot allocate more than a receipt's balance or more than an invoice's outstanding. \u003cb>Reverse allocation\u003c/b> and \u003cb>Cancel receipt\u003c/b> need a reason and keep the record.\u003c/p>\u003cp>\u003cb>Follow-ups.\u003c/b> Log each call, visit or message with outcome, promised date and amount, next follow-up date and who is responsible. Missed promises are shown on the dashboard and in alerts.\u003c/p>\u003cp>\u003cb>Views.\u003c/b> \u003ci>Outstanding\u003c/i>, \u003ci>Ageing\u003c/i> (buckets from settings, by invoice date or due date), \u003ci>Statement\u003c/i> (a client's invoices, receipts and adjustments for a period), \u003ci>Monthly billing\u003c/i> and \u003ci>Monthly collection\u003c/i> reports.\u003c/p>"},{"id":"physical-files","title":"Physical files","html":"\u003cp>\u003cb>Inward entry.\u003c/b> \u003ci>Physical files → Inward entry\u003c/i> when a client's file arrives: client, description, type, received from, location. The system assigns a reference number.\u003c/p>\u003cp>\u003cb>Moving a file.\u003c/b> \u003ci>Transfer\u003c/i> to a person in the office (they must \u003cb>acknowledge\u003c/b>), to a partner, to the client or to an outside party (an expected return date is required). Every movement is kept in order.\u003c/p>\u003cp>\u003cb>Closing the cycle.\u003c/b> \u003ci>Return to office\u003c/i> when it comes back; \u003ci>Archive\u003c/i> with a storage location when finished. If a file cannot be found use \u003ci>Report lost or exception\u003c/i>.\u003c/p>\u003cp>\u003cb>Overdue.\u003c/b> Files past their expected return date appear in the overdue list and in daily reminders to the custodian and the administrator.\u003c/p>"},{"id":"documents","title":"Documents","html":"\u003cp>\u003cb>Upload.\u003c/b> \u003ci>Documents → Upload\u003c/i>: client, optional task, category, description, financial year and confidentiality (Normal, Confidential, Restricted). Allowed types: pdf, doc, docx, xls, xlsx, csv, jpg, jpeg, png, txt, ppt, pptx, zip, xml, json. The size limit is set by the administrator (default 20 MB). Uploading the same name again for the same client and year makes version 2, 3 and so on.\u003c/p>\u003cp>\u003cb>Who can open what.\u003c/b> Normal: the team. Confidential: the client team. Restricted: the client's partner, the uploader and top management only. Files stay private in Google Drive; no public link is ever created, and every download is logged.\u003c/p>\u003cp>\u003cb>Document requests.\u003c/b> \u003ci>Request documents\u003c/i> from a client using a checklist template: items with required / optional marks. Mark each item Received, Incomplete or Not applicable and Verified or Issue. The request becomes Complete when every required item is received. Overdue requests alert the person who made them.\u003c/p>"},{"id":"client-email","title":"Client email","html":"\u003cp>\u003cb>Drafting.\u003c/b> \u003ci>Client email → New draft\u003c/i>: client, template (for example request for purchase invoices, bank statements, fee reminder), recipient, subject and body. Fields such as \u003ccode>{{client_name}}\u003c/code> and \u003ccode>{{period}}\u003c/code> are filled in. Edit the text freely.\u003c/p>\u003cp>\u003cb>Approval.\u003c/b> Depending on the template and settings, a draft needs \u003cb>Senior\u003c/b> or \u003cb>Partner\u003c/b> approval. Press \u003cb>Submit\u003c/b>; the approver \u003cb>Approves\u003c/b> or \u003cb>Rejects\u003c/b> with remarks. You cannot approve your own draft.\u003c/p>\u003cp>\u003cb>Sending.\u003c/b> An approved email is sent with \u003cb>Send\u003c/b>. It goes from the firm's sender address; replies go to the firm's reply address. An email with the same reference is never sent twice. If Gmail's daily limit is reached you see \u003cb>QUOTA\u003c/b>.\u003c/p>\u003cp>\u003cb>Recipient rules.\u003c/b> The administrator can restrict recipients to listed domains. Each send, failure and retry is logged under the client's \u003ci>Emails\u003c/i> tab.\u003c/p>"},{"id":"reports","title":"Reports","html":"\u003cp>\u003ci>Reports\u003c/i> lists the reports you may run. Choose dates and, where relevant, a client, press \u003cb>Run\u003c/b>, then \u003cb>Export CSV\u003c/b> or \u003cb>Print\u003c/b>. Reports contain only the clients and people you are authorised to see.\u003c/p>\u003cp>Work: daily, weekly and monthly work status; employee-wise, partner-wise and client-wise task reports; service-wise workload; pending work; overdue assignments; review and correction; task costing and workload; productivity and time; unallocated time; attendance and leave.\u003c/p>\u003cp>Fees: outstanding fees; fee ageing; collection follow-up; monthly billing; monthly collection; unbilled work.\u003c/p>\u003cp>Office: physical file movement; files in transit; missing documents; compliance deadlines; user activity audit (administrator).\u003c/p>"},{"id":"administration","title":"Administration","html":"\u003cp>Only people with the matching permission see these tabs.\u003c/p>\u003cp>\u003cb>Users.\u003c/b> \u003ci>Add user\u003c/i>: name, email, role, reporting partner, department, mobile, client access (assigned clients or all clients). The system creates an activation key and shows it once. \u003ci>Edit\u003c/i>, \u003ci>Deactivate\u003c/i> (the person is signed out at once; the system tells you how many open tasks need reassigning), \u003ci>Reactivate\u003c/i>, \u003ci>Reset access\u003c/i> (new key) and \u003ci>Clients\u003c/i> (extra client access).\u003c/p>\u003cp>\u003cb>Approving registrations.\u003c/b> People who registered themselves appear with a \u003cb>Pending approval\u003c/b> badge. Press \u003cb>Approve\u003c/b> to let them sign in; they receive an email. The default role of a self-registered user is set in Settings (\u003ccode>registration_default_role\u003c/code>, normally Articled Clerk); change it afterwards in \u003ci>Edit\u003c/i>.\u003c/p>\u003cp>\u003cb>Permissions.\u003c/b> A matrix of roles and permissions. Tick or untick for a role, or give a single person an extra grant or a denial with a reason.\u003c/p>\u003cp>\u003cb>Settings.\u003c/b> Firm name, address, email, GSTIN and state; working hours and days; holidays; ageing buckets and basis; default tax rate; number prefixes; reminder days; review escalation days; email approval level and recipient domains; maximum file size; session length; backup retention. Registration: \u003ccode>open_registration\u003c/code> (Y/N), \u003ccode>registration_approval\u003c/code> (Y/N), \u003ccode>registration_default_role\u003c/code>, \u003ccode>mail_from\u003c/code> (sender address), \u003ccode>mail_from_name\u003c/code>, \u003ccode>app_url\u003c/code> (address printed in emails).\u003c/p>\u003cp>\u003cb>Masters and templates.\u003c/b> Service categories, task templates, checklist templates, email templates, recurring rules and the compliance calendar.\u003c/p>\u003cp>\u003cb>Audit log.\u003c/b> Every sign-in, change, denial, export and download with who, when, old and new values. It cannot be edited. Filter by user, module, action and date.\u003c/p>\u003cp>\u003cb>Backup and triggers.\u003c/b> \u003ci>Back up database now\u003c/i> (a dated copy in Drive; older copies expire per retention), \u003ci>Export CSV\u003c/i>, \u003ci>Document inventory\u003c/i>, \u003ci>Export configuration\u003c/i>, \u003ci>Verify a backup\u003c/i> (compares tab and row counts) and \u003ci>Install / remove daily triggers\u003c/i>. The daily job runs at about 07:00 and the weekly backup on Sunday at about 02:00. Backing up the database does not copy Drive documents; see \u003ccode>BACKUP_RESTORE.md\u003c/code>.\u003c/p>"},{"id":"error-codes","title":"Error codes","html":"\u003cp>When something fails, the message ends with a short code in square brackets, for example \u003ci>Invalid email or password. [AUTH]\u003c/i>. Quote the code and message to your administrator. The full table is in the next section of Help and in \u003ccode>ERROR_CODES.md\u003c/code>.\u003c/p>"},{"id":"daily-routines","title":"Daily routines","html":"\u003cp>\u003cb>Staff.\u003c/b> Open the dashboard; acknowledge new work; start the timer; log time; submit for review; check in and out; apply for leave when needed.\u003c/p>\u003cp>\u003cb>Partners and seniors.\u003c/b> Clear \u003ci>Awaiting review\u003c/i>; allocate new work; approve client emails; check overdue and compliance; look at the productivity and unallocated-time reports weekly.\u003c/p>\u003cp>\u003cb>Accounts.\u003c/b> Issue invoices; record and allocate receipts; log follow-ups; update the file register.\u003c/p>\u003cp>\u003cb>Administrator.\u003c/b> Approve new registrations; check the audit log for denied actions; confirm the last backup is recent; review settings after any change in the firm.\u003c/p>"},{"id":"good-practice","title":"Good practice","html":"\u003cul>\u003cli>Never share your password or activation key. The administrator never needs your password.\u003c/li>\u003cli>Log time daily and correct mistakes through \u003ci>Correct\u003c/i> with a reason.\u003c/li>\u003cli>Do not rely on a compliance date that is still UNVERIFIED.\u003c/li>\u003cli>Use reasons that someone else could understand months later; they are part of the permanent record.\u003c/li>\u003cli>When someone leaves: deactivate them, reassign their open tasks, collect physical files they hold.\u003c/li>\u003c/ul>"}],"errors":[{"id":"intro","title":"Overview","html":"\u003cp>Every error shown by the application ends with a short code in square brackets, for example \u003ci>Invalid email or password. [AUTH]\u003c/i>. The code tells you what kind of problem it is and who can fix it. When you ask for help, give the \u003cb>code\u003c/b>, the \u003cb>full message\u003c/b> and, for SERVER errors, the \u003cb>reference\u003c/b> printed in the message.\u003c/p>"},{"id":"quick-reference","title":"Quick reference","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Code\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Usually fixed by\u003c/th>\u003cth>Typical action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>VALIDATION\u003c/b>\u003c/td>\u003ctd>Something you entered is missing, wrong or not allowed in the current state\u003c/td>\u003ctd>You\u003c/td>\u003ctd>Read the message; correct the field or follow the rule it states\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>AUTH\u003c/b>\u003c/td>\u003ctd>Sign-in, activation, session or password problem\u003c/td>\u003ctd>You / administrator\u003c/td>\u003ctd>Check email and password; sign in again; ask for a new activation key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>PENDING\u003c/b>\u003c/td>\u003ctd>Registration is waiting for administrator approval\u003c/td>\u003ctd>Administrator\u003c/td>\u003ctd>Wait for the approval email; ask the administrator to approve\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>FORBIDDEN\u003c/b>\u003c/td>\u003ctd>You do not have permission, or not for this client, task or document\u003c/td>\u003ctd>Administrator\u003c/td>\u003ctd>Ask for the permission or client access you need\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>NOT_FOUND\u003c/b>\u003c/td>\u003ctd>The record, task, backup or request no longer exists\u003c/td>\u003ctd>You\u003c/td>\u003ctd>Refresh the page; check the id or link\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>DUPLICATE\u003c/b>\u003c/td>\u003ctd>The record already exists (PAN, GSTIN, name, receipt reference and so on)\u003c/td>\u003ctd>You\u003c/td>\u003ctd>Open the existing record instead of creating another\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>OVERLOAD\u003c/b>\u003c/td>\u003ctd>The person you are allocating work to already has a heavy load\u003c/td>\u003ctd>You (partner / senior)\u003c/td>\u003ctd>Confirm to assign anyway, or choose someone else\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>BUSY\u003c/b>\u003c/td>\u003ctd>Another update is in progress\u003c/td>\u003ctd>You\u003c/td>\u003ctd>Wait a few seconds and repeat once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>RATE\u003c/b>\u003c/td>\u003ctd>Too many requests in a short time\u003c/td>\u003ctd>You\u003c/td>\u003ctd>Wait an hour (registration) or a few minutes, then try again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>QUOTA\u003c/b>\u003c/td>\u003ctd>Google's daily limit (for example email) is used up\u003c/td>\u003ctd>Next day / administrator\u003c/td>\u003ctd>Try again tomorrow; send urgent mail manually from Gmail\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>MAIL\u003c/b>\u003c/td>\u003ctd>The email could not be sent\u003c/td>\u003ctd>Administrator\u003c/td>\u003ctd>Check the sender alias, Gmail access and the daily limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>BACKUP\u003c/b>\u003c/td>\u003ctd>A backup could not be made\u003c/td>\u003ctd>Administrator\u003c/td>\u003ctd>Check Drive space and the backup folder; repeat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>SETUP\u003c/b>\u003c/td>\u003ctd>The database, a tab or a Drive folder is not set up\u003c/td>\u003ctd>Administrator\u003c/td>\u003ctd>Run \u003ci>Set up application\u003c/i> again from the script editor; check Settings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>NET\u003c/b>\u003c/td>\u003ctd>The browser could not reach the server\u003c/td>\u003ctd>You / network\u003c/td>\u003ctd>Check the internet connection; reload; try again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>SERVER\u003c/b>\u003c/td>\u003ctd>An unexpected error; the message gives a \u003cb>reference\u003c/b>\u003c/td>\u003ctd>Administrator / developer\u003c/td>\u003ctd>Quote the reference; the administrator finds it in the Apps Script \u003ci>Executions\u003c/i> log\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"how-to-read-a-message","title":"How to read a message","html":"\u003col>\u003cli>\u003cb>The code\u003c/b> (in brackets) = the kind of problem.\u003c/li>\u003cli>\u003cb>The sentence\u003c/b> = what exactly is wrong. Names such as \u003ci>Due date\u003c/i>, \u003ci>Client\u003c/i> or \u003ci>Reason\u003c/i> are the field to correct.\u003c/li>\u003cli>\u003cb>Nothing has been saved\u003c/b> when an error appears. Every save is all-or-nothing, so you can correct and try again safely.\u003c/li>\u003c/ol>"},{"id":"auth-sign-in-activation-session","title":"AUTH - sign-in, activation, session","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Cause\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Invalid email or password.\u003c/td>\u003ctd>Wrong email or password. The message is the same for unknown emails on purpose\u003c/td>\u003ctd>Retype carefully; use \u003ci>Reset access\u003c/i> via the administrator if forgotten\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Too many failed attempts. Try again after 15 minutes.\u003c/td>\u003ctd>Five wrong passwords\u003c/td>\u003ctd>Wait 15 minutes, or ask the administrator to reset access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This account is deactivated. Please contact the administrator.\u003c/td>\u003ctd>The administrator switched the account off\u003c/td>\u003ctd>Contact the administrator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Activation failed. Check the email and code, or ask the administrator for a new code.\u003c/td>\u003ctd>Wrong, used or expired (after 3 days) activation key\u003c/td>\u003ctd>Check the email; use the link on the activation card to get a new key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please sign in.\u003c/td>\u003ctd>No session\u003c/td>\u003ctd>Sign in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Your session has expired. Please sign in again.\u003c/td>\u003ctd>Idle for about 6 hours, or the account was changed\u003c/td>\u003ctd>Sign in again\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This account is not active.\u003c/td>\u003ctd>Account deactivated while you were signed in\u003c/td>\u003ctd>Contact the administrator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Your registration is waiting for administrator approval.\u003c/td>\u003ctd>Self-registered account not yet approved\u003c/td>\u003ctd>See PENDING\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Current password is incorrect.\u003c/td>\u003ctd>Wrong value in \u003ci>Current password\u003c/i> when changing the password\u003c/td>\u003ctd>Retype the current password\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"pending","title":"PENDING","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Cause\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Your registration is waiting for administrator approval. You will be able to sign in once it is approved.\u003c/td>\u003ctd>You activated but the administrator has not approved yet\u003c/td>\u003ctd>Wait for the approval email, or ask the administrator (Administration → Users → Approve)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"registration-messages","title":"Registration messages","html":"\u003cp>For privacy, the registration cards give the \u003cb>same reply\u003c/b> whether or not an email is already known, so that nobody can find out who is registered. When the email is new you receive the activation key; when it is already registered nothing new is created.\u003c/p>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Code\u003c/th>\u003cth>Message\u003c/th>\u003cth>Cause / action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>FORBIDDEN\u003c/td>\u003ctd>Registration is closed. Please contact the firm administrator.\u003c/td>\u003ctd>The setting \u003ccode>open_registration\u003c/code> is N\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RATE\u003c/td>\u003ctd>Too many requests. Please wait a while and try again.\u003c/td>\u003ctd>More than 3 requests per email, or 40 in total, within an hour\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAIL\u003c/td>\u003ctd>We could not send the activation email right now. Please try again later or contact the administrator.\u003c/td>\u003ctd>Gmail refused or the daily limit is reached; the administrator can create the user directly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VALIDATION\u003c/td>\u003ctd>Please enter your full name. / Mobile number must be a 10-digit Indian mobile number. / Please accept the terms and privacy policy to register. / the email format message\u003c/td>\u003ctd>Correct the field\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If no email arrives: look in Spam; wait five minutes; use the resend link; then ask the administrator.\u003c/p>"},{"id":"forbidden-permission","title":"FORBIDDEN - permission","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Cause\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>You do not have permission to do this.\u003c/td>\u003ctd>Your role lacks the permission for this action\u003c/td>\u003ctd>Ask the administrator (Administration → Permissions)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to access this client.\u003c/td>\u003ctd>The client is not assigned to you\u003c/td>\u003ctd>Ask the partner or administrator for client access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to access this task.\u003c/td>\u003ctd>You are not a participant of the task\u003c/td>\u003ctd>Ask the partner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to open this document.\u003c/td>\u003ctd>The document is Confidential or Restricted\u003c/td>\u003ctd>Ask the client's partner; the attempt is logged\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You may not change sensitive identifiers.\u003c/td>\u003ctd>PAN, GSTIN, TAN or CIN can be changed only with \u003ci>See full identifiers\u003c/i>\u003c/td>\u003ctd>Ask a partner\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Review outcomes are recorded through the review action.\u003c/td>\u003ctd>You tried to set an approval status directly\u003c/td>\u003ctd>Use the \u003ci>Review\u003c/i> button\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"not-found","title":"NOT_FOUND","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Cause\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Unknown request.\u003c/td>\u003ctd>The page and the server versions differ (for example after an update)\u003c/td>\u003ctd>Reload the page with Ctrl+F5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Task not found. / \u003ci>name\u003c/i> record not found.\u003c/td>\u003ctd>The record was removed or the link is old\u003c/td>\u003ctd>Refresh the list\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The backup file could not be opened. Check the file id and that the backup still exists in Drive.\u003c/td>\u003ctd>Wrong id or backup expired\u003c/td>\u003ctd>Choose a backup from the list\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"duplicate","title":"DUPLICATE","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Cause\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A client with this PAN already exists (name).\u003c/td>\u003ctd>Same PAN\u003c/td>\u003ctd>Open that client\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A client with this GSTIN already exists (name).\u003c/td>\u003ctd>Same GSTIN\u003c/td>\u003ctd>Open that client\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A client with the same name and entity type already exists.\u003c/td>\u003ctd>Same name\u003c/td>\u003ctd>Open that client or change the name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This service is already assigned to the client for that financial year.\u003c/td>\u003ctd>Service added twice\u003c/td>\u003ctd>Edit the existing line\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A record with the same \u003ci>field\u003c/i> already exists.\u003c/td>\u003ctd>Unique field such as email or service name\u003c/td>\u003ctd>Use a different value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>An email with the same reference was already sent.\u003c/td>\u003ctd>Double send\u003c/td>\u003ctd>Nothing to do; it was sent\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"overload","title":"OVERLOAD","html":"\u003cp>\u003ci>Workload warning: name already has Nh open (capacity Mh / 2 weeks).\u003c/i> This is a confirmation request, not a failure. A box asks \u003ci>Assign anyway?\u003c/i> Confirm only if you have checked the load.\u003c/p>"},{"id":"busy-rate-quota-net","title":"BUSY, RATE, QUOTA, NET","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Code\u003c/th>\u003cth>Message\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>BUSY\u003c/td>\u003ctd>The system is busy with another update. Please try again in a few seconds.\u003c/td>\u003ctd>Repeat the action once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RATE\u003c/td>\u003ctd>Too many requests. Please wait a while and try again.\u003c/td>\u003ctd>Wait\u003c/td>\u003c/tr>\u003ctr>\u003ctd>QUOTA\u003c/td>\u003ctd>The daily email limit has been reached. Please try again tomorrow.\u003c/td>\u003ctd>Resume tomorrow; Gmail allows roughly 100 emails a day on a free account and about 1,500 on Workspace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NET\u003c/td>\u003ctd>Could not reach the server. Check your connection and try again.\u003c/td>\u003ctd>Check the internet; reload; if it persists the web app may be undeployed or down\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NET\u003c/td>\u003ctd>The server returned an unexpected reply.\u003c/td>\u003ctd>Try again; if it persists tell the administrator (the web-app address may be wrong or the permissions not authorised)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"server","title":"SERVER","html":"\u003cp>\u003ci>Something went wrong. Please try again; if it continues contact the administrator and quote reference XXXXXXXX.\u003c/i> The reference matches a line in the script's \u003cb>Executions\u003c/b> log (Apps Script → Executions) and in the audit log. Nothing was saved by that action.\u003c/p>"},{"id":"setup-and-backup-administrator","title":"SETUP and BACKUP (administrator)","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Code\u003c/th>\u003cth>Message\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SETUP\u003c/td>\u003ctd>The database is not set up. Run setupApplication() once from the script editor.\u003c/td>\u003ctd>Run it; check the script property \u003ccode>DB_ID\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SETUP\u003c/td>\u003ctd>Missing tab \u003ci>name\u003c/i>. Run setupApplication().\u003c/td>\u003ctd>Run setup again; it adds missing tabs and keeps data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SETUP\u003c/td>\u003ctd>The Drive root folder is not configured. Run setupApplication() or set it in Settings.\u003c/td>\u003ctd>Run setup or set \u003ccode>root_folder_id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BACKUP\u003c/td>\u003ctd>Backup failed: \u003ci>reason\u003c/i>\u003c/td>\u003ctd>Check Drive storage and the backup folder, then repeat\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"email-sender-problems-administrator","title":"Email sender problems (administrator)","html":"\u003cp>If Gmail rejects the sender alias, the app sends from the account's own address and sets Reply-To to the alias; nothing is lost. To send from info@techmincsc.in add it in Gmail → Settings → Accounts → \u003ci>Send mail as\u003c/i> for the account that owns the script, and confirm the verification mail.\u003c/p>"},{"id":"appendix-validation-messages-by-module","title":"Appendix - validation messages by module","html":"\u003cp>All messages below carry the code \u003cb>VALIDATION\u003c/b>. A … stands for a name or value that the system fills in. Where a message says a field is required, fill it in; where it states a rule, follow the rule.\u003c/p>\u003ch4>Any screen (field checks)\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Field \"…\" is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invalid value \"…\" for ….\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reference not found: … (…).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>… must be a number.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>… must be at least ….\u003c/td>\u003c/tr>\u003ctr>\u003ctd>… must be at most ….\u003c/td>\u003c/tr>\u003ctr>\u003ctd>… must be one of: ….\u003c/td>\u003c/tr>\u003ctr>\u003ctd>… must be a valid date (yyyy-mm-dd).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>… is not a valid email address.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Text is too long (limit … characters).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Request is too large.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Malformed request.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Password must be at least 10 characters.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Password must contain upper case, lower case and a digit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Password must not contain your email name.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This dependency would create a circular chain.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Use \"Submit for review\" to send work for review.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Administration, users and registration\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A reason is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Administrator permissions are fixed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ageing buckets must be numbers separated by commas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>At least one active Firm Administrator must remain.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client not found: …\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contact number must be a 10-digit Indian mobile number.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Full name is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invalid list.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invalid permission list.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile number must be a 10-digit Indian mobile number.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partner in charge must be a partner.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please accept the terms and privacy policy to register.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please enter your full name.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Record not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This user is not waiting for approval.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown master table.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown permission …\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown permission.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown setting …\u003c/td>\u003c/tr>\u003ctr>\u003ctd>User not found or inactive.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>User not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web address must start with https://\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Working days must be digits 0-6 separated by commas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot change your own role.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot deactivate your own account.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Backup\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Backup file id is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Backup folder is not configured. Run setupApplication() or set backup_folder_id in Settings.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Clients\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A maximum of 500 rows can be imported at once.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A partner can only create clients assigned to themselves.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contact mobile must be a 10-digit Indian mobile number.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contact not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duplicate PAN inside the file.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Engagement end date cannot be before the start date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GSTIN format is invalid.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missing required column: …\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mobile number must be a 10-digit Indian mobile number.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name and entity type are required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PAN does not match the PAN embedded in the GSTIN.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PAN format is invalid (expected AAAAA9999A).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partner email not found: …\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partner in charge must be a partner.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Selected … is not an active user.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TAN format is invalid (expected AAAA99999A).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The CSV has no data rows.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Compliance calendar\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A task is already linked to this record.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Calendar entry not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter the acknowledgement / reference number or attach evidence.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter the filing date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Evidence document must belong to this client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Filing date cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Name is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Record not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Record the authoritative source (notification / portal notice) used to verify this due date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Responsible user is not active.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to update this record.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Documents\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Add at least one document to request.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Checklist template not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client folder is not available.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contact does not belong to this client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Document does not belong to this client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Document not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>File is larger than the … MB limit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>File name is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Item not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No file content received.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Received date cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Task does not belong to this client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The file is too large to open through the app. Ask the administrator to share it from Drive.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This file type is not allowed. Allowed: ….\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Too many items.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Client email\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Attachment is not accessible.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Email is not awaiting approval.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Email not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fill in or remove the {{placeholders}} before submitting.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only a draft can be submitted.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only drafts can be edited.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the author can edit this draft.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please give a reason for rejecting.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recipient domain is not in the allowed list set by the administrator.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select a client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subject and message are required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Template not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The daily Gmail sending quota is exhausted. Try again tomorrow.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This email needs …-level approval.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Too many failed attempts. Please review the error and create a new draft.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot approve your own draft. Another partner or the administrator must approve it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot attach document ….\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Fees and receipts\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A reason is required to cancel an invoice.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A reason is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add at least one invoice line.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adjustment not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adjustments apply to issued tax invoices only.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Allocated total exceeds the available receipt amount.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Allocation exceeds the outstanding balance of … (Rs. …).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Allocation not found or already reversed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Due date cannot be before the invoice date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Each line needs a description.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invoice date cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invoice does not belong to this client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invoice is already cancelled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invoice not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invoice … is not an issued tax invoice of this client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Next follow-up cannot be before this follow-up.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only draft invoices can be edited. Cancel and re-issue if a correction is needed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only draft invoices can be issued.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receipt date cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receipt not found or already cancelled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receipt not found or cancelled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receipts are allocated to this invoice. Reverse the allocations first.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Renewal date cannot be before the effective date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The adjustment exceeds the outstanding balance (Rs. …).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The linked task belongs to a different client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The same invoice appears twice in the allocation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Too many invoice lines.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Physical files\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Already acknowledged.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>An archived file cannot be transferred. Return it to office first.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custodian is not an active user.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Describe the exception.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter the archive location.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enter who the file is being sent to.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expected return date cannot be before the dispatch date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expected return date is required when a file goes outside the office.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>File not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Movement not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only files that are in the office can be archived.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the receiving employee can acknowledge this transfer.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Received date cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receiving user is not active.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Return date cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The file is already in the office.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Use the return or archive action for that status.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Reports\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Date range is too long (max 400 days).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>To date cannot be before from date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown report.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Tasks\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A maximum of 100 clients per bulk run.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A reason is required to change the due date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A reason is required when reassigning work.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A reason is required when revising an instruction.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A reason is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A task cannot depend on itself.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A task cannot move from \"…\" to \"…\".\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A … task cannot be edited. Reopen it first.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cannot allocate a … task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Checklist item not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Comment text is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Due date cannot be before the start date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Due date is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Instruction text is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maker-checker rule: you cannot review work you are assigned to.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Not allowed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only a manager can add checklist items.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only a manager can change dependencies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only a manager can release a task from hold.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only a manager can set dependencies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only a partner can reject a submission.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only an assigned user can acknowledge a task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the assigned team or the responsible partner can change the status.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the assigned user can submit work.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the responsible partner can reopen a completed task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the responsible partner or senior can cancel a task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the responsible partner or senior can change a task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only the responsible partner or senior can write instructions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only work in progress (or returned for correction) can be submitted.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only work in progress can be marked complete.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parent comment not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please give a reason for cancelling.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please give a reason for putting the task on hold.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please give a reason for reopening.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please give a reason.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Review remarks are required for this outcome.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select at least one client.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select at least one person to allocate the task to.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select tasks.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select the new assignee.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Template not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This task is not waiting for acknowledgement.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This task requires review/approval. Submit it for review instead.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Title is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Work title is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to allocate this task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to complete this task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to hold this task.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to review this task at its current stage.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Time, attendance and leave\u003c/h4>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A reason is required.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A single entry cannot exceed 16 hours.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A timer is already running. Stop or pause it first.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Attendance record not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Check-out must be after check-in.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Earlier segment not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>End must be after start.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>End time cannot be in the future.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>End time must be after the start time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leave period is too long.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leave request not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Log is still running.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Manual entries older than 31 days need a manager correction.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No timer is running.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Please give a reason for rejecting.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Provide new start and end as yyyy-mm-ddTHH:MM.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Request not found or already decided.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select a task for task time.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Start and end times must be in HH:MM format.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stop the timer before requesting a correction.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stop your running timer before checking out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The corrected time overlaps with another log.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The selected dates contain no working days.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This entry overlaps with an existing time log.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This request cannot be cancelled.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>This task is closed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time cannot be recorded for a future date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time log not found.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>To date cannot be before from date.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Total recorded time for the day would exceed 16 hours.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You already have a leave request overlapping these dates.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to correct this log.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to correct this record.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to decide this leave request.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to decide this request.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to view this person's statistics.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to view this person's time logs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You are not authorised to view this person.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You can record task time only on tasks assigned to you.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You can request corrections only for your own time logs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot approve your own correction.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot approve your own leave.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>You cannot directly correct your own log; raise a correction request.\u003c/td>\u003c/tr>\u003ctr>\u003ctd
