async function vPush(noticeId) {

  if (!V) await vLoad();
  const s = (V && V.settings) || {};
  $('#m').innerHTML = '<h1>VLEBook key &amp; settings</h1><div id="flash"></div>' +
    '<div class="card" style="max-width:720px"><h3>Signing key</h3>' + (VK.sign ? '<div class="msg ' + (VK.test ? 'bad' : 'ok') + '">Unlocked: <b>' + esc(VK.kid) + '</b>' + (VK.test ? ' — TEST key. Do not use for real customers.' : '') + '</div><button class="btn alt" id="vlock">Lock key</button>' :
      '<p class="small mut">Licences, reset codes and push notifications are signed with the Techmin key. Open your key file and enter its passphrase. It stays unlocked only while this tab is open.</p><form id="vuk"><label>Key file (.vlekey)</label>' + (VK.file ? '<p class="small">Remembered: <b>' + esc(VK.file.kid) + '</b> <button class="btn alt" type="button" id="vforget">Use another file</button></p>' : '<input type="file" id="vkf" accept=".vlekey,.json">') + '<label>Passphrase</label><input type="password" id="vkp" name="vle-passphrase" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" required><label style="display:flex;gap:6px;align-items:center;margin:6px 0 0;color:inherit"><input type="checkbox" id="vkshow" style="width:auto"> Show passphrase</label><p><button class="btn" type="submit">Unlock key</button></p></form>') + '</div>' +
    '<form class="card" id="vnk" style="max-width:720px"><h3>Create your own signing key (do this once, before going live)</h3><p class="small mut">Downloads two files: <b>Techmin-signing-key.vlekey</b> (keep it safe — with its passphrase it can issue licences) and <b>licence-pubkey.js</b> (put it in the VLEBook app at js/core/licence-pubkey.js and publish the app). Licences signed with the TEST key stop working after that.</p><div class="row"><div><label>New passphrase (12+ characters)</label><input type="password" name="p1" minlength="12" required autocomplete="new-password" spellcheck="false"></div><div><label>Repeat passphrase</label><input type="password" name="p2" minlength="12" required autocomplete="new-password"></div></div><p><button class="btn alt" type="submit">Create key</button></p></form>' +
    (V ? '<form class="card" id="vfr" style="max-width:720px"><h3>Free launch licence (for every new centre)</h3>' +
      (s.free_token ? '<div class="msg ok">Active: every new centre gets a free full-version licence' + (s.free_to ? ' valid till <b>' + esc(dmy(s.free_to)) + '</b>' : '') + (Number(s.free_users) ? ', ' + esc(s.free_users) + ' users' : ', unlimited users') + '. It is emailed with the welcome mail and activated automatically.</div><p><button class="btn alt" type="button" id="vfstop">Stop giving to new centres</button> <button class="btn bad" type="button" id="vfcancel">Cancel it for everyone</button></p>' :
        '<p class="small mut">While VLEBook is free, sign one licence that works on any computer. New centres receive it by email and VLEBook activates it automatically. When subscriptions start, stop it here and issue paid licences per centre.</p>') +
      '<div class="row"><div><label>Valid until</label><input type="date" name="to" required value="' + esc(s.free_to || '') + '"></div><div><label>Users per centre (0 = unlimited)</label><input type="number" name="users" min="0" value="' + esc(s.free_users || 0) + '"></div></div><p><button class="btn" type="submit"' + (VK.sign ? '' : ' disabled title="Unlock the signing key first"') + '>' + (s.free_token ? 'Replace free licence' : 'Sign &amp; start free licence') + '</button></p></form>' +
      '<form class="card" id="vst" style="max-width:720px"><h3>Support contacts shown in VLEBook</h3><div class="row"><div><label>Name</label><input name="support_name" value="' + esc(s.support_name || 'Techmin') + '"></div><div><label>Phone</label><input name="support_phone" value="' + esc(s.support_phone) + '"></div><div><label>WhatsApp number</label><input name="support_whatsapp" value="' + esc(s.support_whatsapp) + '"></div><div><label>Email</label><input name="support_email" type="email" value="' + esc(s.support_email || 'admin@techmincsc.in') + '"></div><div><label>Website</label><input name="support_website" value="' + esc(s.support_website || 'https://www.complypro.co.in/') + '"></div><div><label>Email me when a centre registers</label><input name="notify_email" type="email" placeholder="vinodnkunni@gmail.com" value="' + esc(s.notify_email) + '"></div><div><label>Send that email</label><select name="notify_new"><option value="Y">Yes</option><option value="N"' + (s.notify_new === 'N' ? ' selected' : '') + '>No</option></select></div><div><label>VLEBook web address (used in emails)</label><input name="app_url" placeholder="https://tools.complypro.co.in/vlebook/" value="' + esc(s.app_url || 'https://tools.complypro.co.in/vlebook/') + '"></div><div><label>Send emails from</label><input name="mail_from" type="email" value="' + esc(s.mail_from || 'admin@techmincsc.in') + '"></div><div><label>Email sender name</label><input name="mail_from_name" value="' + esc(s.mail_from_name || 'Techmin Wealth Partners') + '"></div></div><p class="small mut">Registration and welcome emails are sent from this address. It must be the Google account that owns the registry script, or added to that Gmail account under Settings → Accounts → “Send mail as”. Otherwise Google sends from its default address.</p><p><button class="btn" type="submit">Save</button></p></form>' : vNotReady());
  vBindRefresh(vVleK);
  const lk = $('#vlock'); if (lk) lk.onclick = () => { VK.sign = VK.vapid = null; vVleK(); };
  const fg = $('#vforget'); if (fg) fg.onclick = () => { VK.file = null; try { localStorage.removeItem('vle_keyfile'); } catch (e) { /* ignore */ } vVleK(); };
  const vks = $('#vkshow'); if (vks) vks.onchange = () => { $('#vkp').type = vks.checked ? 'text' : 'password'; };
  const uk = $('#vuk'); if (uk) uk.onsubmit = async ev => {
    ev.preventDefault();
    try {
      let file = VK.file;
      const inp = $('#vkf'); if (inp && inp.files[0]) file = JSON.parse(await inp.files[0].text());
      if (!file) throw new Error('Choose the key file.');
      await vUnlock(file, $('#vkp').value.trim());
      VK.file = file; try { localStorage.setItem('vle_keyfile', JSON.stringify(file)); } catch (e) { /* ignore */ }
      vVleK(); msg('Key unlocked.');
    } catch (e) { msg(e.message, 'bad'); }
  };
  $('#vnk').onsubmit = async ev => {
    ev.preventDefault(); const g = ev.target;
    if (g.p1.value !== g.p2.value) { msg('The two passphrases do not match.', 'bad'); return; }
    if (VK.file && !confirm('You already have a key (' + VK.file.kid + '). Create a NEW key? Existing licences will need to be re-issued after you publish the new app key.')) return;
    const file = await vNewKeyFile(g.p1.value);
    vDownload('Techmin-signing-key-' + file.kid + '.vlekey', JSON.stringify(file, null, 2), 'application/json');
    vDownload('licence-pubkey.js', vPubModule(file), 'text/javascript');
    await vUnlock(file, g.p1.value); VK.file = file; try { localStorage.setItem('vle_keyfile', JSON.stringify(file)); } catch (e) { /* ignore */ }
    vVleK(); msg('New key created and unlocked. Keep the .vlekey file and passphrase safe; publish licence-pubkey.js with the app.');
  };
  const fr = $('#vfr'); if (fr) fr.onsubmit = async ev => {
    ev.preventDefault(); const g = ev.target;
    try {
      const to = g.to.value; if (!to || to < vYmd(new Date())) throw new Error('Choose a future "valid until" date.');
      const lid = 'L-FREE-' + vYmd(new Date()).replace(/-/g, '') + '-' + vRand(3);
      const token = await vSign({ v: 1, kid: VK.kid, typ: 'LIC', lid, cid: '*', centre: 'All centres (free launch offer)', plan: 'FREE', from: vYmd(new Date()), to, dev: ['*'], users: Number(g.users.value) || 0, iat: Date.now() });
      await call('admin.vle_free_save', { token, lid, valid_to: to, users: g.users.value }); await vLoad(); vVleK(); msg('Free licence is active for new centres.');
    } catch (e) { msg(e.message, 'bad'); }
  };
  const fs1 = $('#vfstop'); if (fs1) fs1.onclick = async () => { if (!confirm('Stop giving the free licence to NEW centres? Centres that already have it keep it until its end date.')) return; await call('admin.vle_free_stop', { mode: 'stop' }); await vLoad(); vVleK(); msg('Stopped for new centres.'); };
  const fs2 = $('#vfcancel'); if (fs2) fs2.onclick = async () => { if (!confirm('Cancel the free licence for EVERY centre that uses it? Their VLEBook locks until they get a paid licence.')) return; await call('admin.vle_free_stop', { mode: 'cancel' }); await vLoad(); vVleK(); msg('Free licence cancelled for everyone.'); };
  const st = $('#vst'); if (st) st.onsubmit = async ev => { ev.preventDefault(); const v = {}; new FormData(ev.target).forEach((x, k) => v[k] = x); try { await call('admin.vle_settings_save', { values: v }); await vLoad(); msg('Saved. Centres see the new contacts the next time VLEBook is online.'); } catch (e) { msg(e.message, 'bad'); } };
}
/* ===================== end of VLEBook additions ===================== */

const setHH = () => document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
setHH(); window.addEventListener('resize', setHH); new MutationObserver(setHH).observe(document.querySelector('header'), { childList: true, subtree: true, attributes: true });
(async () => {
  if (!KEY) { lock(''); return; }
  const c = cacheLoad();
  if (c) {
    D = c.D; V = c.V; show();
    const t = new Date(c.at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    const f = $('#flash'); if (f) { f.className = 'msg info'; f.textContent = 'Showing data from ' + t + ' — updating…'; }
    try { await load(); const busyForm = !$('#dr').classList.contains('hide') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) || ['notices', 'vlen', 'vlek', 'settings'].includes(tab); if (!busyForm) show(); const g = $('#flash'); if (g && /updating/.test(g.textContent)) { g.className = 'msg ok'; g.textContent = 'Up to date.'; setTimeout(() => { if (g.textContent === 'Up to date.') { g.className = ''; g.textContent = ''; } }, 2500); } } catch (e) { if (e.code === 'AUTH') lock(e.message); else msg(e.message, 'bad'); }
    return;
  }
  $('#m').innerHTML = '<div class="card" style="max-width:640px;margin:40px auto"><h3>Opening console…</h3><div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></div>';
  try { await load(); show(); } catch (e) { lock(e.message); }
})();
</script></body></html>
