<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><script>(function(){try{if(window.top!==window.self){window.top.location.replace(window.self.location.href);}}catch(e){document.documentElement.style.display='none';}})();</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techmin console - CA Office Manager</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#1c2b3a;--mut:#5b6b7b;--navy:#12345a;--teal:#0b7a8a;--bg:#f4f7fa;--line:#d5dde6;--ok:#1a7f4b;--warn:#b06a00;--bad:#a33}
@media(prefers-color-scheme:dark){:root{--ink:#e6edf5;--mut:#9fb0c2;--navy:#0d2540;--bg:#0f1720;--line:#2a3948}body{background:var(--bg)}.card,table,input,select,textarea,.drawer{background:#16212d!important;color:var(--ink)!important}th{background:#1c2a39!important}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}header b{font-size:19px}header .sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:#cfe0f1;text-decoration:none;padding:6px 12px;border-radius:6px;cursor:pointer}nav a.on{background:#0b7a8a;color:#fff}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat .v{font-size:28px;font-weight:700;color:var(--navy)}.stat .l{color:var(--mut);font-size:13px}
h1{font-size:22px;margin:4px 0 12px;color:var(--navy)}h3{margin:0 0 8px;color:var(--navy)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}.btn.alt{background:transparent;color:var(--teal);border:1px solid var(--teal)}.btn.bad{background:var(--bad)}.btn[disabled]{opacity:.6;cursor:wait}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}th{background:#eef3f8;position:sticky;top:0;cursor:default}td.w{white-space:normal;min-width:200px}tr.click{cursor:pointer}tr.click:hover{background:rgba(11,122,138,.08)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e6edf5;color:#234}.b-ok{background:#d9f2e4;color:#0d5a33}.b-warn{background:#fdecc8;color:#6b4300}.b-bad{background:#f8d9d9;color:#7a1f1f}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.bar>div{min-width:150px}.msg{padding:9px 12px;border-radius:6px;margin:0 0 12px}.msg.bad{background:#f8d9d9;color:#7a1f1f}.msg.ok{background:#d9f2e4;color:#0d5a33}
.drawer{position:fixed;top:0;right:0;width:min(560px,100%);height:100%;background:#fff;box-shadow:-4px 0 18px rgba(0,0,0,.25);overflow:auto;padding:16px;z-index:20}.hide{display:none!important}
dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;margin:0}dt{color:var(--mut)}dd{margin:0;word-break:break-word}.mut{color:var(--mut)}.small{font-size:13px}
.chk{display:flex;gap:14px;flex-wrap:wrap}.chk label{display:flex;gap:5px;align-items:center;margin:0;color:var(--ink)}.chk input{width:auto}
.fl{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
</style></head><body>
<header><b>Techmin console</b><span class="mut" style="color:#cfe0f1">CA Office Manager &middot; CMA Report Maker &middot; firms, users and notices</span><nav id="nav" class="hide"><a data-t="firms" class="on">Firms</a><a data-t="cma">CMA users</a><a data-t="notices">Send a notice</a><a data-t="sent">Notices sent</a><a data-t="settings">Settings</a></nav><span class="sp"></span><button class="btn alt hide" id="out" style="color:#fff;border-color:#fff">Lock</button></header>
<main id="m"></main>
<div class="drawer hide" id="dr" role="dialog" aria-modal="true"></div>
<script>
'use strict';
const REGISTRY_URL = 'https://script.google.com/macros/s/AKfycbxLt8l01NtC3f4CvYQz9vNnfNLXAf0rOIJuHeVq6cvk1AjaaWVfNSB3fILENEsUQJQ/exec';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let KEY = '', D = null, tab = 'firms', draft = {};
try { KEY = sessionStorage.getItem('tk') || ''; } catch (e) { KEY = ''; }
async function call(action, extra) {
  if (!REGISTRY_URL) throw new Error('This console is not connected to the registry yet.');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(REGISTRY_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, admin_key: KEY }, extra || {})), redirect: 'follow', credentials: 'omit', signal: ctl.signal });
    const j = JSON.parse(await r.text()); if (!j.ok) { const e = new Error(j.error.message + ' [' + j.error.code + ']'); e.code = j.error.code; throw e; } return j.data;
  } catch (e) { if (e.code) throw e; throw new Error('Could not reach the registry. Check the internet connection and try again. [NET]'); } finally { clearTimeout(t); }
}
const dmy = s => { s = String(s || ''); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : s; };
const dt = s => { s = String(s || ''); return s ? dmy(s) + ' ' + s.slice(11, 16) : '-'; };
const money = v => v === '' || v == null ? '-' : '₹ ' + Number(v).toLocaleString('en-IN');
const badge = (v, ok, bad) => '<span class="badge ' + (ok.includes(v) ? 'b-ok' : bad.includes(v) ? 'b-bad' : (v ? 'b-warn' : '')) + '">' + esc(v || '-') + '</span>';
const stB = v => badge(v, ['Active'], ['Suspended', 'Closed']), payB = v => badge(v, ['Paid', 'Waived'], ['Overdue']);
function msg(t, k) { const e = $('#flash'); if (e) { e.className = 'msg ' + (k || 'ok'); e.textContent = t; e.scrollIntoView({ block: 'nearest' }); } }
function lock(note) { KEY = ''; D = null; try { sessionStorage.removeItem('tk'); } catch (e) { /* ignore */ } $('#nav').classList.add('hide'); $('#out').classList.add('hide'); $('#dr').classList.add('hide'); $('#m').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto"><h1>Techmin console</h1>' + (note ? '<div class="msg bad">' + esc(note) + '</div>' : '') + '<p class="mut small">Enter the console key that was emailed to the Techmin account when the registry was set up. It is kept only in this browser tab.</p><form id="lf"><label for="k">Console key</label><input id="k" type="password" autocomplete="off" required><p><button class="btn" type="submit">Open console</button></p></form></div>'; $('#lf').onsubmit = async ev => { ev.preventDefault(); KEY = $('#k').value.trim().toUpperCase(); try { await load(); try { sessionStorage.setItem('tk', KEY); } catch (e) { /* ignore */ } show(); } catch (e) { lock(e.message); } }; }
async function load() { D = await call('admin.overview'); }
function show() { $('#nav').classList.remove('hide'); $('#out').classList.remove('hide'); document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.t === tab)); ({ firms: vFirms, cma: vCma, notices: vNotice, sent: vSent, settings: vSettings })[tab](); }
document.addEventListener('click', ev => { const a = ev.target.closest('#nav a'); if (a) { tab = a.dataset.t; show(); } });
$('#out').onclick = () => lock('');
const FCOLS = [['Firm', f => '<b>' + esc(f.firm_name) + '</b><div class="small mut">' + esc(f.firm_id) + '</div>'], ['Registered', f => dmy(f.registered_at)], ['City', f => esc(f.city)], ['State', f => esc(f.state)], ['GSTIN', f => esc(f.gstin || '-')], ['PAN', f => esc(f.pan)], ['Contact', f => esc(f.contact_person) + '<div class="small mut">' + esc(f.mobile) + '</div>'], ['Status', f => stB(f.status)], ['Payment', f => payB(f.payment_status)], ['Due', f => money(f.amount_due)], ['Paid until', f => dmy(f.paid_until) || '-'], ['Version', f => esc(f.app_version || '-')], ['Users', f => esc(f.users || '-')], ['Last seen', f => dt(f.last_seen)]];
let flt = { q: '', status: '', pay: '', state: '' };
function vFirms() {
  const S = D.summary, st = k => Object.keys(S[k]).map(x => x + ': ' + S[k][x]).join(' · ') || '-';
  const states = Object.keys(S.by_state).sort(), L = D.lists;
  const list = D.firms.filter(f => (!flt.status || f.status === flt.status) && (!flt.pay || f.payment_status === flt.pay) && (!flt.state || f.state === flt.state) && (!flt.q || [f.firm_name, f.pan, f.gstin, f.city, f.email, f.contact_person, f.mobile, f.firm_id].join(' ').toLowerCase().includes(flt.q.toLowerCase())));
  $('#m').innerHTML = '<h1>Firms using CA Office Manager</h1><div id="flash"></div><div class="grid" style="margin-bottom:14px"><div class="card stat"><div class="v">' + S.total + '</div><div class="l">Firms registered</div></div><div class="card stat"><div class="v">' + S.this_month + '</div><div class="l">Registered this month</div></div><div class="card"><div class="l mut small">By status</div><div class="small">' + esc(st('by_status')) + '</div></div><div class="card"><div class="l mut small">By payment</div><div class="small">' + esc(st('by_payment')) + '</div></div></div>' +
    '<div class="card"><div class="bar"><div><label>Search</label><input id="fq" value="' + esc(flt.q) + '" placeholder="Name, PAN, GSTIN, city, email"></div><div><label>Status</label><select id="fs"><option value="">All</option>' + L.statuses.map(x => '<option' + (flt.status === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><label>Payment</label><select id="fp"><option value="">All</option>' + L.payments.map(x => '<option' + (flt.pay === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><label>State</label><select id="fst"><option value="">All</option>' + states.map(x => '<option' + (flt.state === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><button class="btn alt" id="csv">Download CSV</button> <button class="btn alt" id="rf">Refresh</button></div></div>' +
    '<p class="small mut">' + list.length + ' of ' + D.firms.length + ' firms. Click a firm to see everything and to update its status and payment.</p><div class="tw"><table><thead><tr>' + FCOLS.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>' + (list.length ? list.map(f => '<tr class="click" data-f="' + esc(f.firm_id) + '">' + FCOLS.map(c => '<td>' + c[1](f) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + FCOLS.length + '" class="mut">No firms match.</td></tr>') + '</tbody></table></div></div>';
  const re = () => { flt = { q: $('#fq').value, status: $('#fs').value, pay: $('#fp').value, state: $('#fst').value }; const p = $('#fq').selectionStart; vFirms(); const q = $('#fq'); q.focus(); try { q.setSelectionRange(p, p); } catch (e) { /* ignore */ } };
  $('#fq').oninput = re; ['fs', 'fp', 'fst'].forEach(i => $('#' + i).onchange = re);
  $('#rf').onclick = async () => { try { await load(); vFirms(); msg('Refreshed.'); } catch (e) { msg(e.message, 'bad'); } };
  $('#csv').onclick = () => { const cols = ['firm_id', 'registered_at', 'firm_name', 'address', 'city', 'state', 'pincode', 'gstin', 'pan', 'frn', 'contact_person', 'email', 'mobile', 'status', 'plan', 'payment_status', 'paid_until', 'amount_due', 'payment_note', 'app_version', 'users', 'last_seen', 'notes']; const cell = v => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }; const csv = [cols.join(',')].concat(list.map(f => cols.map(c => cell(f[c])).join(','))).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'ca-office-manager-firms.csv'; a.click(); };
  document.querySelectorAll('tr.click').forEach(r => r.onclick = () => drawer(r.dataset.f));
}

let cq = { q: '', st: '' };
function vCma() {
  const U = D.cma_users || [], L = D.lists.cma_statuses || [], cnt = k => U.filter(u => u.status === k).length, m = new Date().toISOString().slice(0, 7);
  const list = U.filter(u => (!cq.st || u.status === cq.st) && (!cq.q || [u.name, u.email, u.mobile, u.organisation, u.city, u.state, u.user_id].join(' ').toLowerCase().includes(cq.q.toLowerCase())));
  $('#m').innerHTML = '<h1>CMA Report Maker users</h1><div id="flash"></div><div class="grid" style="margin-bottom:14px"><div class="card stat"><div class="v">' + U.length + '</div><div class="l">Users registered</div></div><div class="card stat"><div class="v">' + cnt('Active') + '</div><div class="l">Activated</div></div><div class="card stat"><div class="v">' + cnt('Pending activation') + '</div><div class="l">Waiting to paste key</div></div><div class="card stat"><div class="v">' + U.filter(u => String(u.registered_at).slice(0, 7) === m).length + '</div><div class="l">Registered this month</div></div></div>' +
    '<div class="card"><div class="bar"><div><label>Search</label><input id="cq" value="' + esc(cq.q) + '" placeholder="Name, email, mobile, organisation, city"></div><div><label>Status</label><select id="cs"><option value="">All</option>' + L.map(x => '<option' + (cq.st === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><button class="btn alt" id="ccsv">Download CSV</button></div></div>' +
    '<p class="small mut">' + list.length + ' of ' + U.length + ' users. Change a status to stop or allow sign-in.</p><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Organisation</th><th>City / State</th><th>Registered</th><th>Last sign-in</th><th>Sign-ins</th><th>Status</th><th></th></tr></thead><tbody>' +
    (list.map(u => '<tr><td><b>' + esc(u.name) + '</b><div class="small mut">' + esc(u.user_id) + '</div></td><td>' + esc(u.email) + '</td><td>' + esc(u.mobile) + '</td><td>' + esc(u.organisation || '-') + '</td><td>' + esc([u.city, u.state].filter(Boolean).join(', ') || '-') + '</td><td>' + dmy(u.registered_at) + '</td><td>' + dt(u.last_login) + '</td><td>' + esc(u.logins || 0) + '</td><td>' + badge(u.status, ['Active'], ['Suspended', 'Closed']) + '</td><td><select data-u="' + esc(u.user_id) + '">' + L.map(x => '<option' + (u.status === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></td></tr>').join('') || '<tr><td colspan="10" class="mut">No users yet.</td></tr>') + '</tbody></table></div></div>';
  const re = () => { cq = { q: $('#cq').value, st: $('#cs').value }; const p = $('#cq').selectionStart; vCma(); const q = $('#cq'); q.focus(); try { q.setSelectionRange(p, p); } catch (e) { /* ignore */ } };
  $('#cq').oninput = re; $('#cs').onchange = re;
  document.querySelectorAll('select[data-u]').forEach(s => s.onchange = async () => { try { await call('admin.cma_update', { user_id: s.dataset.u, values: { status: s.value } }); await load(); vCma(); msg('Status updated.'); } catch (e) { msg(e.message, 'bad'); } });
  $('#ccsv').onclick = () => { const cols = ['user_id', 'registered_at', 'name', 'email', 'mobile', 'organisation', 'designation', 'city', 'state', 'status', 'activated_at', 'last_login', 'logins']; const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; const csv = [cols.join(',')].concat(list.map(u => cols.map(c => q(u[c])).join(','))).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'cma-users.csv'; a.click(); };
}
function drawer(id) {
  const f = D.firms.find(x => x.firm_id === id), L = D.lists, dr = $('#dr'); if (!f) return;
  const row = (k, v) => '<dt>' + k + '</dt><dd>' + (v === '' || v == null ? '-' : esc(v)) + '</dd>';
  dr.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:start"><h1 style="margin:0">' + esc(f.firm_name) + '</h1><button class="btn alt" id="dx">Close</button></div><div class="mut small" style="margin-bottom:10px">' + esc(f.firm_id) + '</div><div id="dflash"></div>' +
    '<div class="card"><h3>Firm details (as registered)</h3><dl>' + row('Registered on', dt(f.registered_at)) + row('Address', f.address + ', ' + f.city + ', ' + f.state + ' - ' + f.pincode) + row('GSTIN', f.gstin) + row('PAN', f.pan) + row('ICAI firm reg. no.', f.frn) + row('Contact person', f.contact_person) + row('Email', f.email) + row('Mobile', f.mobile) + row('Software version', f.app_version) + row('Active users', f.users) + row('Last seen', dt(f.last_seen)) + '</dl></div>' +
    '<form class="card" id="df"><h3>Status and payment</h3><div class="row"><div><label>Status</label><select name="status">' + L.statuses.map(x => '<option' + (f.status === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><label>Plan</label><input name="plan" value="' + esc(f.plan) + '"></div><div><label>Payment status</label><select name="payment_status">' + L.payments.map(x => '<option' + (f.payment_status === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div><div><label>Paid until</label><input type="date" name="paid_until" value="' + esc(f.paid_until) + '"></div><div><label>Amount due (₹)</label><input type="number" min="0" step="0.01" name="amount_due" value="' + esc(f.amount_due) + '"></div></div><label>Note shown to the firm</label><input name="payment_note" maxlength="300" value="' + esc(f.payment_note) + '"><label>Private note (never shown to the firm)</label><textarea name="notes" maxlength="500">' + esc(f.notes) + '</textarea><p><button class="btn" type="submit">Save</button> <button class="btn alt" type="button" id="dn">Send a notice to this firm</button></p></form>';
  dr.classList.remove('hide'); $('#dx').onclick = () => dr.classList.add('hide');
  $('#dn').onclick = () => { draft = { audience: 'SELECTED', firm_ids: [f.firm_id] }; dr.classList.add('hide'); tab = 'notices'; show(); };
  $('#df').onsubmit = async ev => { ev.preventDefault(); const b = ev.submitter; b.disabled = true; const v = {}; new FormData(ev.target).forEach((x, k) => v[k] = x); try { await call('admin.firm_update', { firm_id: id, values: v }); await load(); drawer(id); $('#dflash').innerHTML = '<div class="msg ok">Saved. The firm sees the change the next time its administrator opens the application.</div>'; if (tab === 'firms') vFirms(); } catch (e) { $('#dflash').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; b.disabled = false; } };
}
function vNotice() {
  const L = D.lists, dr = draft; const sel = dr.firm_ids || [], ps = dr.payment_status || ['Due', 'Overdue'];
  $('#m').innerHTML = '<h1>Send a notice to firms</h1><div id="flash"></div><form class="card" id="nf"><div class="row"><div><label>Title</label><input name="title" maxlength="150" required value="' + esc(dr.title) + '"></div><div><label>Colour / importance</label><select name="severity"><option value="info">Information (blue)</option><option value="warning"' + (dr.severity === 'warning' ? ' selected' : '') + '>Warning (amber)</option><option value="critical"' + (dr.severity === 'critical' ? ' selected' : '') + '>Important (red, cannot be dismissed)</option></select></div></div><label>Message</label><textarea name="message" maxlength="2000" required>' + esc(dr.message) + '</textarea><div class="row"><div><label>Link text (optional)</label><input name="link_text" maxlength="80" value="' + esc(dr.link_text) + '"></div><div><label>Link address (optional, https://)</label><input name="link_url" type="url" placeholder="https://" value="' + esc(dr.link_url) + '"></div></div>' +
    '<label>Who receives it</label><select name="audience" id="aud"><option value="FIRMS">All registered firms</option><option value="SELECTED"' + (dr.audience === 'SELECTED' ? ' selected' : '') + '>Selected firms</option><option value="PAYMENT"' + (dr.audience === 'PAYMENT' ? ' selected' : '') + '>Firms with a payment status (for payment reminders)</option><option value="ALL"' + (dr.audience === 'ALL' ? ' selected' : '') + '>Everyone, including people who have not registered</option></select>' +
    '<div id="a-sel" class="hide"><label>Choose firms</label><div class="fl">' + D.firms.map(f => '<label style="display:flex;gap:6px;margin:2px 0;color:inherit"><input type="checkbox" style="width:auto" name="fid" value="' + esc(f.firm_id) + '"' + (sel.includes(f.firm_id) ? ' checked' : '') + '> ' + esc(f.firm_name) + ' <span class="mut small">' + esc(f.city) + ' &middot; ' + esc(f.pan) + '</span></label>').join('') + '</div></div>' +
    '<div id="a-pay" class="hide"><label>Payment status</label><div class="chk">' + L.payments.map(x => '<label><input type="checkbox" name="pay" value="' + esc(x) + '"' + (ps.includes(x) ? ' checked' : '') + '> ' + esc(x) + '</label>').join('') + '</div></div>' +
    '<div class="row"><div><label>Show from (optional)</label><input type="date" name="starts"></div><div><label>Show until (optional)</label><input type="date" name="ends"></div></div><label class="chk" style="margin-top:12px"><span class="chk"><label><input type="checkbox" name="email_firms" value="Y"' + (dr.email ? ' checked' : '') + '> Also email this notice to the firm email of each firm that receives it (sent within the hour, once)</label></span></label>' +
    '<p id="reach" class="small mut"></p><p><button class="btn" type="submit">Send notice</button></p></form>';
  const au = $('#aud'); au.value = dr.audience || 'FIRMS';
  const reach = () => { const a = au.value; $('#a-sel').classList.toggle('hide', a !== 'SELECTED'); $('#a-pay').classList.toggle('hide', a !== 'PAYMENT'); let n; const act = D.firms.filter(f => f.status !== 'Closed'); if (a === 'FIRMS') n = act.length; else if (a === 'SELECTED') n = document.querySelectorAll('input[name=fid]:checked').length; else if (a === 'PAYMENT') { const p = [...document.querySelectorAll('input[name=pay]:checked')].map(x => x.value); n = act.filter(f => p.includes(f.payment_status)).length; } else n = null; $('#reach').textContent = n === null ? 'Shown to every firm and on the sign-in page. Not emailed unless you tick the email box.' : 'Reaches ' + n + ' firm(s).'; };
  au.onchange = reach; document.querySelectorAll('input[name=fid],input[name=pay]').forEach(i => i.onchange = reach); reach();
  $('#nf').onsubmit = async ev => { ev.preventDefault(); const f = ev.target, b = ev.submitter, a = au.value; const v = { title: f.title.value, message: f.message.value, severity: f.severity.value, link_text: f.link_text.value, link_url: f.link_url.value, audience: a, starts: f.starts.value, ends: f.ends.value, email_firms: f.email_firms.checked ? 'Y' : 'N', active: 'Y', firm_ids: [...f.querySelectorAll('input[name=fid]:checked')].map(x => x.value).join(','), payment_status: [...f.querySelectorAll('input[name=pay]:checked')].map(x => x.value).join(',') };
    const who = a === 'ALL' ? 'everyone' : a === 'FIRMS' ? 'all registered firms' : a === 'SELECTED' ? v.firm_ids.split(',').filter(Boolean).length + ' selected firm(s)' : 'firms with payment status ' + v.payment_status; if (!confirm('Send "' + v.title + '" to ' + who + (v.email_firms === 'Y' ? ' and email it' : '') + '?')) return;
    b.disabled = true; try { await call('admin.notice_save', { values: v }); draft = {}; await load(); tab = 'sent'; show(); msg('Notice sent. Firms see it the next time their administrator opens the application' + (v.email_firms === 'Y' ? '; emails go out within the hour (or press "Send emails now" under Settings).' : '.')); } catch (e) { msg(e.message, 'bad'); b.disabled = false; } };
}
function vSent() {
  $('#m').innerHTML = '<h1>Notices sent</h1><div id="flash"></div><div class="card"><div class="tw"><table><thead><tr><th>Sent</th><th>Title</th><th>Audience</th><th>Reach</th><th>Colour</th><th>Email</th><th>Shown</th><th></th></tr></thead><tbody>' + (D.notices.length ? D.notices.map(n => '<tr><td>' + dt(n.created_at) + '</td><td class="w"><b>' + esc(n.title) + '</b><div class="small mut">' + esc(String(n.message).slice(0, 140)) + '</div></td><td>' + esc(n.audience) + (n.audience === 'PAYMENT' ? ' (' + esc(n.payment_status) + ')' : '') + '</td><td>' + n.reach + '</td><td>' + esc(n.severity) + '</td><td>' + (n.email_firms === 'Y' ? (n.emailed_at ? 'sent ' + dt(n.emailed_at) : 'waiting') : '-') + '</td><td>' + (String(n.active).toUpperCase() === 'N' ? '<span class="badge b-bad">Withdrawn</span>' : '<span class="badge b-ok">Showing</span>') + '</td><td><button class="btn alt" data-tg="' + esc(n.notice_id) + '" data-to="' + (String(n.active).toUpperCase() === 'N' ? 'Y' : 'N') + '">' + (String(n.active).toUpperCase() === 'N' ? 'Show again' : 'Withdraw') + '</button></td></tr>').join('') : '<tr><td colspan="8" class="mut">No notices yet.</td></tr>') + '</tbody></table></div></div>';
  document.querySelectorAll('[data-tg]').forEach(b => b.onclick = async () => { b.disabled = true; try { await call('admin.notice_save', { notice_id: b.dataset.tg, values: { active: b.dataset.to } }); await load(); vSent(); msg('Updated.'); } catch (e) { msg(e.message, 'bad'); b.disabled = false; } });
}
function vSettings() {
  const s = D.settings;
  $('#m').innerHTML = '<h1>Settings</h1><div id="flash"></div><form class="card" id="sf" style="max-width:640px"><div class="row"><div><label>Support email (shown to firms)</label><input name="support_email" type="email" value="' + esc(s.support_email) + '"></div><div><label>Send notice emails as (optional alias)</label><input name="mail_from" type="email" value="' + esc(s.mail_from) + '"></div><div><label>Sender name</label><input name="mail_from_name" value="' + esc(s.mail_from_name) + '"></div><div><label>Email me when a firm registers</label><select name="notify_new_firms"><option value="Y"' + (s.notify_new_firms !== 'N' ? ' selected' : '') + '>Yes</option><option value="N"' + (s.notify_new_firms === 'N' ? ' selected' : '') + '>No</option></select></div></div><p><button class="btn" type="submit">Save settings</button></p></form><div class="card" style="max-width:640px"><h3>Emails</h3><p class="small mut">Notices marked "also email" are sent automatically every hour. Press the button to send them now. Gmail limits apply (about 100 a day on a free account, 1,500 on Google Workspace).</p><button class="btn alt" id="sn">Send emails now</button></div>';
  $('#sf').onsubmit = async ev => { ev.preventDefault(); const v = {}; new FormData(ev.target).forEach((x, k) => v[k] = x); try { await call('admin.settings_save', { values: v }); await load(); msg('Settings saved.'); } catch (e) { msg(e.message, 'bad'); } };
  $('#sn').onclick = async ev => { ev.target.disabled = true; try { const r = await call('admin.send_now'); msg(r.sent + ' email(s) sent.'); } catch (e) { msg(e.message, 'bad'); } ev.target.disabled = false; };
}
(async () => { if (KEY) { try { await load(); show(); return; } catch (e) { lock(e.message); return; } } lock(''); })();
</script></body></html>
