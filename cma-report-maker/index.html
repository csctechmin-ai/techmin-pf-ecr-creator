<style>:root{--ink:#1c2b3a;--mut:#5b6b7b;--navy:#12345a;--teal:#0b7a8a;--bg:#f4f7fa;--card:#fff;--line:#d5dde6;--ok:#1a7f4b;--okbg:#d9f2e4;--warn:#8a5a00;--warnbg:#fdecc8;--bad:#a33;--badbg:#f8d9d9;--calc:#f1f6fb;--in:#fffef6}

header.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header.top b{font-size:18px}header.top .sp{flex:1}header.top a{color:#cfe0f1}
.who{font-size:13px;color:#cfe0f1}.saved{font-size:12px;color:#9fe0b6}
main{max-width:1280px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
h1{font-size:22px;margin:4px 0 10px;color:var(--navy)}h2{font-size:18px;margin:4px 0 8px;color:var(--navy)}h3{font-size:16px;margin:0 0 6px;color:var(--navy)}

label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.mut{color:var(--mut)}.small{font-size:13px}
