<style>:root{--ink:#1c2b3a;--mut:#5b6b7b;--navy:#12345a;--teal:#0b7a8a;--bg:#f4f7fa;--card:#fff;--line:#d5dde6;--ok:#1a7f4b;--okbg:#d9f2e4;--warn:#8a5a00;--warnbg:#fdecc8;--bad:#a33;--badbg:#f8d9d9;--calc:#f1f6fb;--in:#fffef6}

/* interest helper (Workings sheet) */
function vTools() {
  var c = cur(), t = c.tools || (c.tools = { open: '', rate: '12.5', rep: ['', '', '', '', '', ''], wcrate: '11.5' });
  var d = S.d; var cols = c.years.map(function (y, i) { return '<th class="r">' + esc(y) + '</th>'; }).join('');
  return '<h1>Interest helper</h1><p class="small mut">Works out interest on a term loan from its repayment schedule (interest each quarter on the opening balance, as in the workbook) and on working capital from average borrowings. Use the result to fill Form II and the term-loan lines in Form III.</p>' +
    '<div class="card"><h3>Term loan</h3><div class="row"><div><label>Balance at the start of the first year (Rs. lakhs)</label><input id="t-open" inputmode="decimal" value="' + esc(t.open) + '"></div><div><label>Rate of interest (% a year)</label><input id="t-rate" inputmode="decimal" value="' + esc(t.rate) + '"></div></div>' +
    '<div class="tw" style="max-height:none;margin-top:10px"><table class="s"><thead><tr><th></th>' + cols + '</tr></thead><tbody><tr><td>Repayment each quarter</td>' + t.rep.map(function (v, i) { return '<td><input data-tr="' + i + '" inputmode="decimal" style="text-align:right" value="' + esc(v) + '"></td>'; }).join('') + '</tr><tr><td>Interest for the year</td>' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<td class="r" id="t-int' + i + '"></td>'; }).join('') + '</tr><tr><td>Repaid in the year</td>' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<td class="r" id="t-rep' + i + '"></td>'; }).join('') + '</tr><tr><td>Balance at year end</td>' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<td class="r" id="t-cl' + i + '"></td>'; }).join('') + '</tr><tr><td>Due within the next year</td>' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<td class="r" id="t-due' + i + '"></td>'; }).join('') + '</tr></tbody></table></div>' +
    '<p><button class="btn" id="t-use">Put in Form II and Form III</button> <span class="small mut">Fills "Interest on term loans", "Instalments due within one year" and "Term loan" (balance less the instalments due).</span></p></div>' +
    '<div class="card"><h3>Working capital interest</h3><div class="row"><div><label>Rate of interest (% a year)</label><input id="w-rate" inputmode="decimal" value="' + esc(t.wcrate) + '"></div></div><p class="small mut">Interest = average of the opening and closing bank borrowings (Form III item 1) &times; rate. The first year uses its closing balance.</p><div class="tw" style="max-height:none"><table class="s"><thead><tr><th></th>' + cols + '</tr></thead><tbody><tr><td>Average bank borrowings</td>' + d.bank_tot.map(function (v, i) { return '<td class="r">' + money(i === 0 ? v : (v + d.bank_tot[i - 1]) / 2) + '</td>'; }).join('') + '</tr><tr><td>Interest for the year</td>' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<td class="r" id="w-int' + i + '"></td>'; }).join('') + '</tr></tbody></table></div><p><button class="btn" id="w-use">Put in Form II</button></p></div>';
}
function bTools() {
  var c = cur(), t = c.tools, calc = {};
  function run() {
    var bal = E.num(t.open), rate = E.num(t.rate) / 100; calc = { int: [], rep: [], cl: [], due: [] };
    for (var i = 0; i < 6; i++) { var q = E.num(t.rep[i]), it = 0, rp = 0; for (var k = 0; k < 4; k++) { it += bal * rate / 4; var r = Math.min(q, bal); bal -= r; rp += r; } calc.int.push(it); calc.rep.push(rp); calc.cl.push(bal); }
    for (var j = 0; j < 6; j++) calc.due.push(Math.min(calc.cl[j], (j < 5 ? E.num(t.rep[j + 1]) : E.num(t.rep[5])) * 4));
    for (var x = 0; x < 6; x++) { $('#t-int' + x).textContent = money(calc.int[x]); $('#t-rep' + x).textContent = money(calc.rep[x]); $('#t-cl' + x).textContent = money(calc.cl[x]); $('#t-due' + x).textContent = money(calc.due[x]); }
    var wr = E.num(t.wcrate) / 100; for (var y = 0; y < 6; y++) { var av = y === 0 ? S.d.bank_tot[0] : (S.d.bank_tot[y] + S.d.bank_tot[y - 1]) / 2; $('#w-int' + y).textContent = money(av * wr); calc['w' + y] = av * wr; }
  }
  run();
  $('#t-open').oninput = function () { t.open = this.value; run(); saveSoon(); }; $('#t-rate').oninput = function () { t.rate = this.value; run(); saveSoon(); }; $('#w-rate').oninput = function () { t.wcrate = this.value; run(); saveSoon(); };
  $$('[data-tr]').forEach(function (i) { i.oninput = function () { t.rep[+i.dataset.tr] = i.value; run(); saveSoon(); }; });
  $('#t-use').onclick = function () { for (var i = 0; i < 6; i++) { c.v.int_tl[i] = Math.round(calc.int[i] * 100) / 100; c.v.tl_inst[i] = Math.round(calc.due[i] * 100) / 100; c.v.tl1[i] = Math.round((calc.cl[i] - calc.due[i]) * 100) / 100; } saveNow(); alert('Done. Form II interest on term loans and the Form III term-loan lines were filled for all six years.'); };
  $('#w-use').onclick = function () { for (var i = 0; i < 6; i++) c.v.int_wc[i] = Math.round(calc['w' + i] * 100) / 100; saveNow(); alert('Done. Form II interest on working capital was filled for all six years.'); };
}
/* report and exports */

  function tbl(rows) { return '<table><thead><tr><th></th><th>Particulars</th>' + c.years.map(function (y, i) { return '<th>' + esc(y) + '<br>' + esc(c.kinds[i]) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (r) { if (r.h) return '<tr><td colspan="8"><b>' + esc(r.h) + '</b></td></tr>'; return '<tr><td>' + esc(r.no || '') + '</td><td>' + (r.b ? '<b>' : '') + esc(r.l) + (r.b ? '</b>' : '') + '</td>' + d[r.i || r.f].map(function (v) { return '<td class="n">' + (raw ? (v === null || v === undefined || !isFinite(v) ? '' : Math.round(v * 10000) / 10000) : fmtRow(r, v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>'; }
  var pg = '<div class="pg"><div class="ph"><h2>CREDIT MONITORING ARRANGEMENT</h2><b>' + esc(m.company || c.name) + '</b><br>' + esc(m.constitution || '') + (m.activity ? ' | ' + esc(m.activity) : '') + '<br>' + esc(m.address || '') + '<br>Bank: ' + esc(m.bank || '') + ' ' + esc(m.branch || '') + '<br>Prepared by: ' + esc(m.prepared_by || '') + ' ' + esc(m.date || '') + '</div></div>';
  pg += '<div class="pg">' + head('FORM I: PARTICULARS OF EXISTING / PROPOSED LIMITS') + '<table><thead><tr><th>Bank</th><th>Nature of facility</th><th>Type</th><th>Existing limit</th><th>Max. use</th><th>Min. use</th><th>Balance</th><th>Proposed</th></tr></thead><tbody>' + c.limits.map(function (l) { return '<tr><td>' + esc(l.bank) + '</td><td>' + esc(l.nature) + '</td><td>' + esc(l.kind) + '</td>' + ['limit', 'maxu', 'minu', 'bal', 'proposed'].map(function (k) { return '<td class="n">' + (l[k] === '' ? '' : money(E.num(l[k]))) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>' +
    (c.assoc.length ? '<br><table><thead><tr><th>Associate concern</th><th>Activity</th><th>B/S date</th><th>Bank</th><th>Fund based</th><th>Non-fund based</th><th>Term loan</th><th>Overdues</th></tr></thead><tbody>' + c.assoc.map(function (l) { return '<tr><td>' + esc(l.name) + '</td><td>' + esc(l.activity) + '</td><td>' + esc(l.bs_date) + '</td><td>' + esc(l.bank) + '</td>' + ['wc_fb', 'wc_nfb', 'tl', 'overdue'].map(function (k) { return '<td class="n">' + (l[k] === '' ? '' : money(E.num(l[k]))) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>' : '') + '</div>';
  pg += '<div class="pg">' + head('FORM II: OPERATING STATEMENT') + tbl(E.FORM2) + '</div><div class="pg">' + head('FORM III: ANALYSIS OF BALANCE SHEET') + tbl(E.FORM3L.concat(E.FORM3A)) + '</div><div class="pg">' + head('FORM IV: COMPARATIVE STATEMENT OF CURRENT ASSETS AND CURRENT LIABILITIES') + tbl(E.FORM4) + '</div><div class="pg">' + head('FORM V: COMPUTATION OF MAXIMUM PERMISSIBLE BANK FINANCE') + tbl(E.FORM5) + '</div><div class="pg">' + head('FORM VI: FUNDS FLOW STATEMENT') + tbl(E.FORM6) + '</div>';
  pg += '<div class="pg">' + head('RATIO ANALYSIS') + '<table><thead><tr><th>Ratio</th><th>Norm</th>' + c.years.map(function (y) { return '<th>' + esc(y) + '</th>'; }).join('') + '</tr></thead><tbody>' + E.RATIOS.map(function (r) { return '<tr><td>' + esc(r[0] + ': ' + r[1]) + '</td><td>' + r[4] + ' ' + (r[3] === 'p' ? (r[5] * 100) + '%' : r[5]) + '</td>' + d[r[2]].map(function (v) { return '<td class="n">' + (raw ? (v === null || !isFinite(v) ? '' : Math.round(v * 10000) / 10000) : fmtRatio(r[3], v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  return pg;
}

function fname(s) { return String(s).replace(/[^A-Za-z0-9._-]+/g, '_').slice(0, 60) || 'cma'; }

/* backup / restore */
function pack(cases) { return { app: 'CMA-RM', format: 1, version: VER, exported: now(), user: S.user ? { name: S.user.name, email: S.user.email } : null, cases: cases }; }
function backup() { download(new Blob([JSON.stringify(pack(S.data.cases), null, 1)], { type: 'application/json' }), 'CMA-backup-' + now().slice(0, 10) + '.json'); S.data.lastBackup = now(); saveNow(); route(); }
function validCase(c) { return c && typeof c === 'object' && typeof c.name === 'string' && c.v && c.years && c.years.length === 6 && E.INPUTS.every(function (k) { return Array.isArray(c.v[k]) && c.v[k].length === 6; }); }
function restore(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) return alert('This file is too large to be a CMA backup. [CMA-FILE-03]');
  var fr = new FileReader();
  fr.onload = function () {
    var j; try { j = JSON.parse(fr.result); } catch (e) { return alert('This file is not a valid backup (it cannot be read). [CMA-FILE-01]'); }
    if (!j || j.app !== 'CMA-RM' || !Array.isArray(j.cases)) return alert('This file is not a CMA Report Maker backup. [CMA-FILE-02]');
    var good = j.cases.filter(validCase); if (!good.length) return alert('The backup has no usable cases. [CMA-FILE-01]');
    var replace = confirm('Found ' + good.length + ' case(s) in the backup.\n\nOK = REPLACE all cases in this browser with the backup.\nCancel = choose to add them instead.');
    if (!replace && !confirm('Add the ' + good.length + ' case(s) from the backup to your existing cases?')) return;
    if (replace) { S.data.cases = good; S.data.active = null; } else good.forEach(function (c) { if (S.data.cases.some(function (x) { return x.id === c.id; })) c.id = E.blankCase().id; S.data.cases.unshift(c); });
    saveNow(); route(); alert('Restored ' + good.length + ' case(s).');
  };
  fr.onerror = function () { alert('The file could not be read. [CMA-FILE-01]'); }; fr.readAsText(file);
}
